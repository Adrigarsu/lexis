# Continuous integration for every PR and every push to main (D-77, D-159).
# Steps follow the order in docs/arquitectura/pruebas.md; a failing step skips
# the rest. Author signatures are checked locally, not here (D-140).
# Actions are pinned to a commit SHA with the version in a comment; Dependabot
# keeps both up to date (D-153).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version here: it reads packageManager from package.json (ADR-024).
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Unit, component and integration tests with coverage
        run: pnpm test:coverage

      # Only Postgres is needed for pgTAP, so the rest of the local stack stays off.
      - name: Start the local database
        run: pnpm exec supabase db start

      - name: Database tests (pgTAP)
        run: pnpm test:db

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @lexis/e2e exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
