# Daily minimal query that keeps the free Supabase project from pausing after
# 7 days without activity (HU-75, D-71, D-168). If it fails, GitHub emails the
# person who last changed the schedule, which is the alert RNF-07 asks for.
# GitHub disables scheduled workflows after 60 days without repository activity.
name: Keep Supabase active

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      # ubuntu-latest ships the psql client. The URL is the session pooler
      # connection string, with the password, stored as an environment secret.
      - name: Run a minimal query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" --no-psqlrc --quiet --tuples-only --command 'select 1'
