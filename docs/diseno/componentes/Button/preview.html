<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Botón</title>
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div><p class="cap">Variantes</p><div class="row">
<button class="lx-btn lx-btn--primary">Estudiar hoy</button>
<button class="lx-btn lx-btn--secondary">Más lento</button>
<button class="lx-btn lx-btn--text">Ver todas las lecturas</button>
<button class="lx-btn lx-btn--danger">Borrar cuenta…</button>
</div></div>
<div><p class="cap">Icono y audio · desactivado</p><div class="row">
<button class="lx-btn lx-btn--icon" aria-label="Ajustes de estudio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
<button class="lx-btn lx-btn--audio" aria-label="Escuchar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
<button class="lx-btn lx-btn--audio" aria-label="Escuchando" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
<button class="lx-btn lx-btn--primary" aria-disabled="true">Comprobar</button>
<span style="font:400 13px/18px var(--font-sans);color:var(--ink-2)">Ordena todas las palabras para comprobar</span>
</div></div>
<div style="max-width:360px"><button class="lx-btn lx-btn--primary lx-btn--block">Comprobar</button></div>
</div>
</body>
</html>
