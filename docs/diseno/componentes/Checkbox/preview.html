<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Casilla</title>
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}

<div class="lx stage">
<div style="max-width:460px">
<label class="lx-check"><input type="checkbox" checked><span>Tengo 14 años o más</span></label>
<label class="lx-check"><input type="checkbox" aria-invalid="true" aria-describedby="priv-err"><span>He leído y acepto la <a href="#" style="color:var(--jade)">política de privacidad</a></span></label>
<span class="lx-field__error" id="priv-err" style="margin-left:34px">Tienes que aceptarla para crear la cuenta.</span>
</div>
</div>
