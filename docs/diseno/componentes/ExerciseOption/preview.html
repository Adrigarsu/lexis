<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Opción de ejercicio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div style="max-width:420px;display:flex;flex-direction:column;gap:var(--space-2)">
<button class="lx-option"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t3">我</span><rt class="t3">wǒ</rt><span class="t4">是</span><rt class="t4">shì</rt><span class="t2">学</span><rt class="t2">xué</rt><span class="t5">生</span><rt class="t5">sheng</rt></ruby></button>
<button class="lx-option" aria-pressed="true">Soy profesor.</button>
<button class="lx-option" data-state="correct" aria-describedby="m1">Soy estudiante.<span class="lx-option__mark" id="m1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Correcta</span></button>
<button class="lx-option" data-state="wrong" aria-describedby="m2">Es estudiante.<span class="lx-option__mark" id="m2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Tu respuesta</span></button>
<button class="lx-option" data-state="dim">Somos estudiantes.</button>
</div>
</div>
</body>
</html>
