<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Carácter con pinyin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div class="row" style="gap:var(--space-8)">
<div><p class="cap">Colores en el pinyin (por defecto)</p><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t1">妈</span><rt class="t1">mā</rt><span class="t2">麻</span><rt class="t2">má</rt><span class="t3">马</span><rt class="t3">mǎ</rt><span class="t4">骂</span><rt class="t4">mà</rt><span class="t5">吗</span><rt class="t5">ma</rt></ruby></div>
<div class="lx-tones-all"><p class="cap">Pinyin y caracteres</p><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t1">妈</span><rt class="t1">mā</rt><span class="t2">麻</span><rt class="t2">má</rt><span class="t3">马</span><rt class="t3">mǎ</rt><span class="t4">骂</span><rt class="t4">mà</rt><span class="t5">吗</span><rt class="t5">ma</rt></ruby></div>
<div class="lx-tones-off"><p class="cap">Sin color</p><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t1">妈</span><rt class="t1">mā</rt><span class="t2">麻</span><rt class="t2">má</rt><span class="t3">马</span><rt class="t3">mǎ</rt><span class="t4">骂</span><rt class="t4">mà</rt><span class="t5">吗</span><rt class="t5">ma</rt></ruby></div>
</div>
<div class="row" style="gap:var(--space-8);align-items:flex-end">
<div><p class="cap">Kai 楷体</p><ruby class="lx-hz lx-hz--xl" lang="zh-Hans"><span class="t3">你</span><rt class="t3">nǐ</rt><span class="t3">好</span><rt class="t3">hǎo</rt></ruby></div>
<div class="lx-font-hei"><p class="cap">Hei 黑体</p><ruby class="lx-hz lx-hz--xl" lang="zh-Hans"><span class="t3">你</span><rt class="t3">nǐ</rt><span class="t3">好</span><rt class="t3">hǎo</rt></ruby></div>
<div class="lx-font-song"><p class="cap">Song 宋体</p><ruby class="lx-hz lx-hz--xl" lang="zh-Hans"><span class="t3">你</span><rt class="t3">nǐ</rt><span class="t3">好</span><rt class="t3">hǎo</rt></ruby></div>
<div><p class="cap">Lectura que cambia: 行 aquí se lee háng</p><ruby class="lx-hz lx-hz--xl" lang="zh-Hans"><span class="t2">银</span><rt class="t2">yín</rt><span class="t2">行</span><rt class="t2 lx-reading-change">háng</rt></ruby></div>
</div>
</div>
</body>
</html>
