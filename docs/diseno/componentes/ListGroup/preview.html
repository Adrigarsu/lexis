<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Lista agrupada</title>
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div style="max-width:420px">
<p class="lx-list__heading">Estudio</p>
<ul class="lx-list">
<li><a class="lx-row" href="#"><span class="lx-row__text"><span class="lx-row__title">Ajustes de estudio y metas</span><span class="lx-row__desc">[15] min · [5] nuevas · 2 descansos</span></span><svg class="lx-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></li>
<li><a class="lx-row" href="#"><span class="lx-row__text"><span class="lx-row__title">Recordatorios</span><span class="lx-row__desc">[3] de 4 activados</span></span><svg class="lx-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></li>
<li><label class="lx-row lx-switch" style="cursor:pointer"><span class="lx-switch__text"><span class="lx-switch__title">Caracteres extra</span><span class="lx-switch__desc">[50] radicales y [200] caracteres frecuentes</span></span><input type="checkbox" role="switch"></label></li>
</ul>
</div>
</div>
</body>
</html>
