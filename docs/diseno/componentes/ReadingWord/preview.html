<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Palabra en una lectura</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<p class="lx-read lx-hz--read" style="margin:0;max-width:520px" lang="zh-Hans">
<button class="lx-word"><ruby class="lx-hz " lang="zh-Hans"><span class="t3">我</span><rt class="t3">wǒ</rt></ruby></button><button class="lx-word"><ruby class="lx-hz " lang="zh-Hans"><span class="t4">在</span><rt class="t4">zài</rt></ruby></button><button class="lx-word" aria-expanded="true" aria-controls="pop"><ruby class="lx-hz " lang="zh-Hans"><span class="t1">商</span><rt class="t1">shāng</rt><span class="t4">店</span><rt class="t4">diàn</rt></ruby></button><button class="lx-word lx-word--new"><ruby class="lx-hz " lang="zh-Hans"><span class="t3">买</span><rt class="t3">mǎi</rt></ruby></button><ruby class="lx-hz " lang="zh-Hans"><span class="t5">了</span><rt class="t5">le</rt></ruby><button class="lx-word"><ruby class="lx-hz " lang="zh-Hans"><span class="t1">三</span><rt class="t1">sān</rt></ruby></button><button class="lx-word lx-word--new"><ruby class="lx-hz " lang="zh-Hans"><span class="t5">个</span><rt class="t5">ge</rt></ruby></button><button class="lx-word lx-word--new"><ruby class="lx-hz " lang="zh-Hans"><span class="t2">苹</span><rt class="t2">píng</rt><span class="t3">果</span><rt class="t3">guǒ</rt></ruby></button>。
</p>
<div class="lx-popover" id="pop" role="dialog" aria-label="商店">
<div class="lx-popover__head"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t1">商</span><rt class="t1">shāng</rt><span class="t4">店</span><rt class="t4">diàn</rt></ruby><button class="lx-btn lx-btn--audio" aria-label="Escuchar 商店"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg></button></div>
<span class="lx-popover__meaning">tienda</span>
<button class="lx-btn lx-btn--secondary">Añadir a mis palabras</button>
</div>
</div>
</body>
</html>
