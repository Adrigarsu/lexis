<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Segmentos</title>
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div class="lx-segmented" role="tablist" aria-label="Cómo respondes" style="width:100%;max-width:420px">
<button role="tab" aria-selected="false">Escribir</button><button role="tab" aria-selected="true">Opciones</button><button role="tab" aria-selected="false">Hablar</button>
</div>
<div class="lx-segmented" role="group" aria-label="Periodo" style="max-width:320px">
<button aria-pressed="true">Semana</button><button aria-pressed="false">Mes</button><button aria-pressed="false">Todo</button>
</div>
</div>
<script>
document.querySelectorAll('.lx-segmented').forEach(function (g) {
  var attr = g.getAttribute('role') === 'tablist' ? 'aria-selected' : 'aria-pressed';
  g.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { g.querySelectorAll('button').forEach(function (o) { o.setAttribute(attr, String(o === b)); }); }); });
});
</script>
</body>
</html>
