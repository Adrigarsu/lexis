<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Select</title>
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div class="row" style="align-items:flex-start">
<label class="lx-field col"><span class="lx-field__label">Fuente de los caracteres</span><select class="lx-select"><option selected>Kai 楷体</option><option>Sans 黑体</option><option>Song 宋体</option></select><span class="lx-field__help">Kai se parece a la escritura a mano.</span></label>
<label class="lx-field col"><span class="lx-field__label">Guía de escritura</span><select class="lx-select"><option>Sin guía</option><option selected>Contorno completo</option><option>Siguiente trazo</option></select></label>
</div>
</div>
</body>
</html>
