<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Tarjeta de estudio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div class="row" style="align-items:stretch">
<div class="lx-study" style="flex:1;min-width:260px">
<span class="lx-study__kind">Significado</span>
<ruby class="lx-hz lx-hz--hero" lang="zh-Hans"><span class="t3">你</span><rt class="t3">nǐ</rt><span class="t3">好</span><rt class="t3">hǎo</rt></ruby>
<div class="lx-study__audio"><button class="lx-btn lx-btn--audio" aria-label="Escuchar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg></button><button class="lx-btn lx-btn--audio" aria-label="Escuchar más lento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg></button></div>
<button class="lx-btn lx-btn--primary lx-btn--block" style="margin-top:var(--space-4)">Mostrar respuesta</button>
</div>
<div class="lx-study" style="flex:1;min-width:260px">
<span class="lx-study__kind">Significado</span>
<ruby class="lx-hz lx-hz--hero" lang="zh-Hans"><span class="t2">银</span><rt class="t2">yín</rt><span class="t2">行</span><rt class="t2 lx-reading-change">háng</rt></ruby>
<div class="lx-study__divider"></div>
<span class="lx-study__meaning">banco</span>
<span class="lx-study__note">行 aquí se lee háng (normalmente xíng)</span>
</div>
</div>
</div>
</body>
</html>
