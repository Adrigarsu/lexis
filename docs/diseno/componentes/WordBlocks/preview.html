<!doctype html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../pantallas/assets/lexis.css">
<meta charset="utf-8">
<title>Bloques de la frase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.stage{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-2);margin:0 0 var(--space-2)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-width:220px;flex:1}
</style>
</head>
<body>
<div class="lx stage">
<div style="max-width:440px;display:flex;flex-direction:column;gap:var(--space-4)">
<div class="lx-answer" aria-label="Tu frase">
<button class="lx-block lx-block--placed"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t1">他</span><rt class="t1">tā</rt></ruby></button><button class="lx-block lx-block--placed"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t4">是</span><rt class="t4">shì</rt></ruby></button>
</div>
<div class="lx-bank" aria-label="Palabras disponibles">
<button class="lx-block"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t3">老</span><rt class="t3">lǎo</rt><span class="t1">师</span><rt class="t1">shī</rt></ruby></button>
<button class="lx-block" aria-pressed="true"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t3">我</span><rt class="t3">wǒ</rt></ruby></button>
<button class="lx-block lx-block--ghost" aria-hidden="true" tabindex="-1"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t1">他</span><rt class="t1">tā</rt></ruby></button>
<button class="lx-block"><ruby class="lx-hz lx-hz--lg" lang="zh-Hans"><span class="t5">的</span><rt class="t5">de</rt></ruby></button>
</div>
</div>
</div>
</body>
</html>
