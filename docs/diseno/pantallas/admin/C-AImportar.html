<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin: importar · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; min-height: 860px; box-sizing: border-box; background: var(--surface-sunken); font-family: var(--font-sans); color: var(--ink); display: flex">
  <nav aria-label="Administración" style="width: 248px; flex: none; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px">
    <div style="padding: 0 12px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; display: grid; place-items: center; border: 2.5px solid var(--jade); border-radius: 4px; color: var(--jade); font: 900 15px/1 'Noto Serif SC', serif">词</span>Lexis</span>
      <span style="font-size: 12px; font-weight: 600; color: var(--ink-2)">Administración</span>
    </div>
    <a href="C-AResumen.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Resumen</a><span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">CONTENIDO</span><a href="C-ACaracteres.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h12v13H4zM8 4h12v13"/></svg>Palabras<span style="margin-left: auto; font-size: 12px; color: var(--ink-2)">[88] sin significado</span></a><a href="C-AGramatica.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Caracteres y radicales</a><a href="C-AGramatica.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h8v8H3zM13 13h8v8h-8z"/></svg>Gramática</a><a href="C-ALectura.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v14"/></svg>Lecturas</a><a href="C-APalabras.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Niveles y cursos</a><a href="C-AImportar.dc.html" aria-current="page" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: var(--surface-sunken); font-weight: 600; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Importar</a><span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">COMUNIDAD</span><a href="C-AReportes.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21V4h11l-1 4 4 0v9H6"/></svg>Reportes de errores<span style="margin-left: auto; font-size: 12px; color: var(--ink-2)">[4]</span></a><a href="C-AUsuarios.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 8a3 3 0 1 0 0-.1M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-.1M15 20h6"/></svg>Usuarios</a><span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">SISTEMA</span><a href="C-AAuditoria.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 7v5l3 3M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>Registro de cambios</a>
    <a href="C-DInicio.dc.html" style="margin-top: auto; min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); background: var(--surface)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Volver a la app</a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 26px; font-weight: 700">Importar contenido</h1><span style="font-size: 13px; color: var(--ink-2)">CSV o JSON · descarga la plantilla para ver las columnas</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap"><button style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Descargar plantilla CSV</button></div>
    </header>
    <ol aria-label="Pasos" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 8px">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="3"><li aria-current="{{ st.current }}" style="min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 18px; display: flex; align-items: center; font-size: 14px; font-weight: 600; {{ st.style }}; background: var(--surface)">{{ st.label }}</li></sc-for>
    </ol>
    <sc-if value="{{ onReview }}" hint-placeholder-val="{{ true }}">
      <section aria-labelledby="i-sum" style="padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px">
          <h2 id="i-sum" style="margin: 0; font-size: 16px; font-weight: 700">hsk1-cedict.csv · [120] filas</h2>
          <span style="font-size: 14px">[96] nuevas · [14] a actualizar · [7] sin cambios · <strong>[3] con errores</strong></span>
        </div>
        <span style="font-size: 13px; color: var(--ink-2)">Fuente: CC-CEDICT (CC BY-SA). Los significados en inglés no se importan: hay que escribirlos en español.</span>
        <table style="width: 100%; border-collapse: collapse">
          <thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line)">Acción</th><th scope="col" style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line)">Caracteres</th><th scope="col" style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line)">Pinyin</th><th scope="col" style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line)">Significado</th><th scope="col" style="text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line)">Detalle</th></tr></thead>
          <tbody><tr><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">Nueva</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span lang="zh-Hans" style="font-family: var(--font-kai); font-size: 18px">杯子</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">bēizi</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">taza, vaso</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; color: var(--ink-2)"></td></tr><tr><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--surface)">Actualizar</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span lang="zh-Hans" style="font-family: var(--font-kai); font-size: 18px">茶</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">chá</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">té</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; color: var(--ink-2)">Cambia el significado: «té (bebida)» → «té»</td></tr><tr><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px dashed var(--ink); color: var(--ink); background: var(--surface)">Error</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span lang="zh-Hans" style="font-family: var(--font-kai); font-size: 18px">菜</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">cai</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">—</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; color: var(--ink-2)">Pinyin sin tono · falta el significado</td></tr><tr><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">Nueva</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span lang="zh-Hans" style="font-family: var(--font-kai); font-size: 18px">电脑</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">diànnǎo</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">ordenador</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; color: var(--ink-2)"></td></tr><tr><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--surface)">Sin cambios</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle"><span lang="zh-Hans" style="font-family: var(--font-kai); font-size: 18px">爱</span></td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">ài</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle">amar, querer</td><td style="padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; color: var(--ink-2)"></td></tr></tbody>
        </table>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 18px; height: 18px">Saltar las filas con errores y descargarlas para corregirlas</label>
        <div style="display: flex; justify-content: flex-end; gap: 8px"><button style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Cambiar archivo</button><button onClick="{{ confirm }}" style="min-height: 40px; padding: 0 16px; border: 1px solid var(--jade); border-radius: 8px; background: var(--jade); color: var(--on-jade); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Importar [110] filas como borrador</button></div>
      </section>
    </sc-if>
    <sc-if value="{{ onDone }}" hint-placeholder-val="{{ false }}">
      <section role="status" style="padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Importación terminada</h2>
        <span style="font-size: 14px">[96] palabras nuevas y [14] actualizadas, todas como <strong>borrador</strong>. Revísalas y publícalas desde Palabras.</span>
        <div style="display: flex; gap: 8px"><a href="C-APalabras.dc.html" style="min-height: 40px; padding: 0 16px; border: 1px solid var(--jade); border-radius: 8px; background: var(--jade); color: var(--on-jade); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Ir a Palabras</a><button onClick="{{ back }}" style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Volver</button><button style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Descargar las [3] filas con errores</button></div>
      </section>
    </sc-if>
  </main>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1 };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;
    return { tema: __tema, 
      ok: true,
      steps: ['Archivo', 'Revisar', 'Confirmar'].map((label, i) => ({
        label: (i + 1) + '. ' + label, current: i === s.step ? 'step' : 'false',
        style: i === s.step ? 'background: var(--jade); color: var(--surface); border-color: var(--jade)' : i < s.step ? 'background: var(--surface-sunken)' : 'background: var(--surface); color: var(--jade-bright)'
      })),
      onReview: s.step === 1,
      onDone: s.step === 2,
      confirm: () => this.setState({ step: 2 }),
      back: () => this.setState({ step: 1 })
    };
  }
}
</script>
</body>
</html>
