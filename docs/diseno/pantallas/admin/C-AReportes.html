<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin: reportes · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; min-height: 860px; box-sizing: border-box; background: var(--surface-sunken); font-family: var(--font-sans); color: var(--ink); display: flex">
  <nav aria-label="Administración" style="width: 248px; flex: none; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px">
    <div style="padding: 0 12px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; display: grid; place-items: center; border: 2.5px solid var(--jade); border-radius: 4px; color: var(--jade); font: 900 15px/1 'Noto Serif SC', serif">词</span>Lexis</span>
      <span style="font-size: 12px; font-weight: 600; color: var(--ink-2)">Administración</span>
    </div>
    <a href="C-AResumen.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Resumen</a><span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">CONTENIDO</span><a href="C-ACaracteres.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h12v13H4zM8 4h12v13"/></svg>Palabras<span style="margin-left: auto; font-size: 12px; color: var(--ink-2)">[88] sin significado</span></a><a href="C-AGramatica.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Caracteres y radicales</a><a href="C-AGramatica.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h8v8H3zM13 13h8v8h-8z"/></svg>Gramática</a><a href="C-ALectura.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v14"/></svg>Lecturas</a><a href="C-APalabras.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Niveles y cursos</a><a href="C-AImportar.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Importar</a><span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">COMUNIDAD</span><a href="C-AReportes.dc.html" aria-current="page" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: var(--surface-sunken); font-weight: 600; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 21V4h11l-1 4 4 0v9H6"/></svg>Reportes de errores<span style="margin-left: auto; font-size: 12px; color: var(--ink-2)">[4]</span></a><a href="C-AUsuarios.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 8a3 3 0 1 0 0-.1M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-.1M15 20h6"/></svg>Usuarios</a><span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">SISTEMA</span><a href="C-AAuditoria.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 7v5l3 3M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>Registro de cambios</a>
    <a href="C-DInicio.dc.html" style="margin-top: auto; min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); background: var(--surface)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Volver a la app</a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 26px; font-weight: 700">Reportes de errores</h1><span style="font-size: 13px; color: var(--ink-2)">[4] sin revisar · los envían los usuarios desde cualquier tarjeta</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap"></div>
    </header>
    <div style="display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap">
      <ul aria-label="Reportes" style="flex: 1 1 360px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ reps }}" as="r" hint-placeholder-count="4">
          <li><button aria-pressed="{{ r.pressed }}" onClick="{{ r.pick }}" style="width: 100%; padding: 12px 14px; border-radius: 10px; font: inherit; color: var(--ink); text-align: left; display: flex; flex-direction: column; gap: 2px; {{ r.style }}">
            <span style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{ r.kind }}</span><span style="font-weight: 400; color: var(--ink-2)">{{ r.when }}</span></span>
            <span style="font-size: 14px">{{ r.where }}</span>
            <span style="font-size: 12px; color: var(--ink-2)">de {{ r.who }}</span>
          </button></li>
        </sc-for>
      </ul>
      <section aria-labelledby="r-det" style="flex: 2 1 460px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="r-det" style="margin: 0; font-size: 16px; font-weight: 700">{{ selKind }}</h2><span style="font-size: 13px; color: var(--ink-2)">{{ selWho }} · {{ selWhen }}</span></div>
        <span style="font-size: 14px; font-weight: 600">{{ selWhere }}</span>
        <blockquote style="margin: 0; padding: 12px 14px; border-left: 3px solid var(--ink); background: var(--surface-sunken); font-size: 15px">{{ selText }}</blockquote>
        <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Respuesta al usuario (opcional)<textarea rows="3" style="min-height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; background: var(--surface); color: var(--ink); padding: 10px 12px">Gracias, ya está corregido.</textarea><span style="font-size: 12px; color: var(--ink-2)">Le llega como notificación dentro de la app</span></label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap"><a href="C-APalabraEditar.dc.html" style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Abrir en el editor</a><button onClick="{{ resolve }}" style="min-height: 40px; padding: 0 16px; border: 1px solid var(--jade); border-radius: 8px; background: var(--jade); color: var(--on-jade); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Marcar como resuelto</button><button style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Descartar</button></div>
        </sc-if>
        <sc-if value="{{ resolved }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 14px; font-weight: 600">Resuelto. Se ha avisado al usuario y queda en el registro de cambios.</p></sc-if>
      </section>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, done: false };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;
    const R = [["Pinyin incorrecto", "茶 · tarjeta de significado", "luis_m", "Hoy 01:12", "Dice chà, debería ser chá."], ["Audio no se oye", "谢谢 · pronunciar", "ana.r", "Ayer 20:40", "En Safari no suena el modelo."], ["Traducción", "Lectura 在商店 · frase 4", "kiko", "Ayer 11:03", "«¿Cuánto cuestan?» suena mejor que «¿Cuánto es?»."], ["Otro", "我 · escritura", "sara_p", "7 nov", "El trazo 5 no lo reconoce bien."]];
    return { tema: __tema, 
      ok: true,
      reps: R.map((r, i) => ({ kind: r[0], where: r[1], who: r[2], when: r[3], pressed: String(s.sel === i),
        style: s.sel === i ? 'border: 2px solid var(--jade); background: var(--surface-sunken)' : 'border: 1px solid var(--line); background: var(--surface)',
        pick: () => this.setState({ sel: i, done: false }) })),
      sel: R[s.sel],
      selKind: R[s.sel][0], selWhere: R[s.sel][1], selWho: R[s.sel][2], selWhen: R[s.sel][3], selText: R[s.sel][4],
      resolved: s.done,
      open: !s.done,
      resolve: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
