class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dlg: false };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;

      ask: () => this.setState({ dlg: true }),
      close: () => this.setState({ dlg: false })
    };
  }
}
