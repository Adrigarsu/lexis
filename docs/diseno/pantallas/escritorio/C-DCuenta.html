<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta y privacidad (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; min-height: 860px; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-wrap: wrap">

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Navegación principal" style="flex: 1 1 220px; max-width: 248px; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 16px 12px">
        <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; display: grid; place-items: center; border: 2.5px solid var(--jade); border-radius: 4px; color: var(--jade); font: 900 15px/1 'Noto Serif SC', serif">词</span>Lexis</span>
        <button aria-label="Ocultar menú" aria-expanded="true" onClick="{{ toggle }}" style="width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      </div>
      <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Hoy</a>
      <span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">PRACTICAR</span>
      <sc-for list="{{ practice }}" as="it" hint-placeholder-count="6">
        <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{ it.d }}"/></svg>{{ it.label }}</a>
      </sc-for>
      <div style="height: 1px; background: var(--surface-sunken); margin: 12px 4px"></div>
      <a href="C-DProgreso.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
      <a href="C-DPerfil.dc.html" aria-current="page" aria-label="Perfil de adri: cuenta y ajustes" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-sunken); text-decoration: none; color: var(--ink)">
        <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 14px; font-weight: 600">adri</span>
          <span style="font-size: 12px; color: var(--ink-2)">Perfil y ajustes</span>
        </span>
      </a>
    </nav>
  </sc-if>

  <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Navegación principal" style="width: 64px; flex: none; box-sizing: border-box; padding: 20px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px">
      <button aria-label="Mostrar menú" aria-expanded="false" onClick="{{ toggle }}" style="width: 44px; height: 44px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
      <a href="C-DInicio.dc.html" aria-label="Hoy" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></a>
      <div style="width: 28px; height: 1px; background: var(--surface-sunken); margin: 8px 0"></div>
      <sc-for list="{{ practice }}" as="it" hint-placeholder-count="6">
        <a href="C-DInicio.dc.html" aria-label="{{ it.label }}" title="{{ it.label }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{ it.d }}"/></svg></a>
      </sc-for>
      <div style="width: 28px; height: 1px; background: var(--surface-sunken); margin: 8px 0"></div>
      <a href="C-DProgreso.dc.html" aria-label="Progreso" title="Progreso" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
      <a href="C-DPerfil.dc.html" aria-current="page" aria-label="Perfil y ajustes" title="Perfil y ajustes" style="margin-top: auto; width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--ink); background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink)">A</a>
    </nav>
  </sc-if>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 64px">
    <div style="max-width: 720px; display: flex; flex-direction: column; gap: 28px">
      <header style="display: flex; flex-direction: column; gap: 8px">
        <a href="C-DPerfil.dc.html" style="align-self: flex-start; min-height: 32px; display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Perfil</a>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700">Cuenta y privacidad</h1>
      </header>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Cuenta</h2>
        <div style="border: 1px solid var(--line); border-radius: 10px; background: var(--surface)">
          <div style="min-height: 64px; display: flex; align-items: center; gap: 16px; padding: 8px 20px; border-bottom: 1px solid var(--line)">
            <span style="width: 180px; font-size: 13px; color: var(--ink-2)">Nombre de usuario</span><span style="flex: 1; font-size: 15px">adri</span>
            <a href="C-DCuenta.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 600">Cambiar</a>
          </div>
          <div style="min-height: 64px; display: flex; align-items: center; gap: 16px; padding: 8px 20px; border-bottom: 1px solid var(--line)">
            <span style="width: 180px; font-size: 13px; color: var(--ink-2)">Email</span><span style="flex: 1; font-size: 15px">[tu@email.com]</span>
            <a href="C-DVerificar.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 600">Cambiar</a>
          </div>
          <div style="min-height: 64px; display: flex; align-items: center; gap: 16px; padding: 8px 20px">
            <span style="width: 180px; font-size: 13px; color: var(--ink-2)">Contraseña</span><span style="flex: 1; font-size: 15px">Cambiada hace [2] meses</span>
            <a href="C-DCuenta.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 600">Cambiar</a>
          </div>
        </div>
        <span style="font-size: 13px; color: var(--ink-2)">El email nuevo no se aplica hasta verificarlo con un código. Para cambiar la contraseña te pediremos la actual.</span>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Tus datos</h2>
        <div style="display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface)">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 500">Descargar mis datos</span><span style="font-size: 13px; color: var(--ink-2)">Un archivo JSON con tu cuenta, ajustes, tarjetas y listas propias y todo tu historial de estudio.</span></span>
          <button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink)">Descargar (JSON)</button>
        </div>
        <a href="C-DCuenta.dc.html" style="align-self: flex-start; padding: 8px 0; font-size: 14px">Política de privacidad</a>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Zona peligrosa</h2>
        <div style="display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface)">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 500">Borrar la cuenta</span><span style="font-size: 13px; color: var(--ink-2)">Se borran tu cuenta y todos tus datos. No se puede deshacer.</span></span>
          <button onClick="{{ openDialog }}" style="min-height: 44px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink)">Borrar cuenta…</button>
        </div>
      </section>
    </div>
  </main>

  <sc-if value="{{ dialogOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 24px">
      <div role="dialog" aria-modal="true" aria-labelledby="borrar-titulo-d" style="width: 100%; max-width: 480px; box-sizing: border-box; padding: 28px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 14px">
        <h2 id="borrar-titulo-d" style="margin: 0; font-size: 20px; font-weight: 700">¿Borrar tu cuenta?</h2>
        <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2)">
          <li>Se borran tu cuenta, tu progreso, tus tarjetas y tus listas.</li>
          <li>Desaparecerán de las copias de seguridad en 4 semanas como máximo.</li>
          <li>Si quieres guardarlos, descárgalos antes.</li>
        </ul>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Escribe tu contraseña para confirmar<input type="password" autocomplete="current-password" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; background: var(--surface)"></label>
        <span style="font-size: 12px; color: var(--ink-2)">Necesitas conexión a internet.</span>
        <div style="display: flex; justify-content: flex-end; gap: 10px">
          <button onClick="{{ closeDialog }}" style="min-height: 44px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink)">Cancelar</button>
          <button style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--jade); font: inherit; font-size: 14px; font-weight: 600; color: var(--on-jade)">Borrar para siempre</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, dialog: false };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const open = this.state.open;
    return { tema: __tema, 
      expanded: open,
      collapsed: !open,
      toggle: () => this.setState({ open: !open }),
      practice: [
        { label: 'Tarjetas', d: 'M4 7h12v13H4zM8 4h12v13' },
        { label: 'Escritura', d: 'M4 20h4L19 9l-4-4L4 16z' },
        { label: 'Tonos', d: 'M2 12c3-6 5-6 8 0s5 6 8 0 3-3 4-2' },
        { label: 'Gramática', d: 'M3 3h8v8H3zM13 13h8v8h-8zM13 7h8M7 13v8' },
        { label: 'Lecturas', d: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v14' },
        { label: 'Mis listas', d: 'M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1' }
      ],
      dialogOpen: this.state.dialog,
      openDialog: () => this.setState({ dialog: true }),
      closeDialog: () => this.setState({ dialog: false })
    };
  }
}
</script>
</body>
</html>
