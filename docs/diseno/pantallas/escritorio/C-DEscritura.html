<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritura de caracteres (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; min-height: 860px; box-sizing: border-box; background: var(--surface-sunken); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Salir</a>
    <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: var(--ink-2)">Escritura · [3] de [8]</span>
      <div style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><div style="width: 38%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></div></div>
    </div>
    <button aria-haspopup="dialog" aria-expanded="{{ panelExpanded }}" onClick="{{ togglePanel }}" style="min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; font-size: 13px; font-weight: 600; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes de estudio</button>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap">
    <main style="flex: 999 1 560px; min-width: 0; padding: 40px 24px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-direction: row; flex-wrap: nowrap; gap: 48px; align-items: center; justify-content: space-between">
          <div style="flex: 1 1 0; min-width: 240px; display: flex; flex-direction: column; gap: 20px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2)">ESCRIBE EL CARÁCTER</span>
              <span style="font-size: 26px; font-weight: 600">bueno, bien</span>
              <span style="font-size: 20px; font-weight: 600; color: {{ pc3 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">hǎo</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Pista · H</button>
              <button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Escuchar · A</button>
              <button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Borrar · Supr</button>
            </div>
            <a href="C-DEscrituraFin.dc.html" style="font-size: 14px; color: var(--ink-2)">No puedo trazar: elegir entre opciones</a>
          </div>
          <div role="img" aria-label="Cuadrícula de escritura: escribe 好 trazo a trazo" style="position: relative; width: 360px; height: 360px; flex: none; border: 2px solid var(--line-strong); border-radius: 10px; background: var(--surface)">
            <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0"><path d="M50 0V100M0 50H100M0 0L100 100M100 0L0 100" stroke-width="0.4" stroke-dasharray="2 2" fill="none" style="stroke: var(--grid-line)"/></svg>
            <sc-if value="{{ showOutline }}" hint-placeholder-val="{{ true }}">
              <span lang="zh-Hans" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-kai); font-size: 280px; color: var(--on-jade)">好</span>
            </sc-if>
            <span lang="zh-Hans" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-kai); font-size: 280px; color: var(--ink); clip-path: inset(0 52% 0 0)">好</span>
            <sc-if value="{{ showNext }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; right: 14%; top: 22%; width: 34%; height: 5px; border-radius: 3px; background: var(--line-strong)"></span>
            </sc-if>
            <span style="position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: var(--ink-2)">Trazo 4 de 6</span>
          </div>
        </div>
      </div>
    </main>

    <sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ true }}">
      <aside role="dialog" aria-label="Ajustes de estudio" style="flex: 1 1 300px; max-width: 340px; box-sizing: border-box; padding: 24px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">Ajustes de estudio</h2>
          <button aria-label="Cerrar ajustes" onClick="{{ togglePanel }}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-guide-label" style="font-size: 14px; font-weight: 600">Guía de escritura</span>
          <div role="group" aria-labelledby="d-guide-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ guides }}" as="g" hint-placeholder-count="3">
              <button aria-pressed="{{ g.pressed }}" onClick="{{ g.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ g.style }}; background: var(--surface)">{{ g.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600">Valoración automática <input type="checkbox" checked="{{ autoRate }}" onChange="{{ toggleRate }}" aria-describedby="auto-rate-help" style="width: 22px; height: 22px"></label>
          <span id="auto-rate-help" style="font-size: 12px; color: var(--ink-2)">Apagada: al terminar cada carácter eliges tú cómo de bien lo sabías. Encendida: la app lo valora según tus fallos y pistas.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-size-label" style="font-size: 14px; font-weight: 600">1 · Tamaño de los caracteres</span>
          <div role="group" aria-labelledby="d-size-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="3">
              <button aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ s.style }}; background: var(--surface)">{{ s.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-pinyin-label" style="font-size: 14px; font-weight: 600">2 · Pinyin</span>
          <div role="group" aria-labelledby="d-pinyin-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
              <button aria-pressed="{{ m.pressed }}" onClick="{{ m.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ m.style }}; background: var(--surface)">{{ m.label }}</button>
            </sc-for>
          </div>
          <sc-if value="{{ showSlider }}" hint-placeholder-val="{{ true }}">
            <label for="d-opacity" style="display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2)">Opacidad <span>{{ opacity }} %</span></label>
            <input id="d-opacity" type="range" min="10" max="90" step="10" value="{{ opacity }}" onChange="{{ setOpacity }}" style="width: 100%; height: 36px">
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-color-label" style="font-size: 14px; font-weight: 600">3 · Colores según el tono</span>
          <div role="group" aria-labelledby="d-color-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ colorModes }}" as="c" hint-placeholder-count="3">
              <button aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ c.style }}; background: var(--surface)">{{ c.label }}</button>
            </sc-for>
          </div>
          <sc-if value="{{ colorsOn }}" hint-placeholder-val="{{ true }}">
            <div aria-label="Leyenda de colores por tono" style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2)">
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-1)"></span>1.º ā</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-2)"></span>2.º á</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-3)"></span>3.º ǎ</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-4)"></span>4.º à</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--jade-bright)"></span>neutro</span>
            </div>
          </sc-if>
        </div>
        <label style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600">4 · Audio automático al girar <input type="checkbox" checked="{{ autoAudio }}" onChange="{{ toggleAudio }}" style="width: 20px; height: 20px"></label>
        <span style="margin-top: auto; font-size: 12px; color: var(--ink-2)">Se guarda para todas tus sesiones. Más opciones en Perfil › Ajustes.</span>
      </aside>
    </sc-if>
  </div>
  <sc-if value="{{ introOpen }}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="intro-title" aria-describedby="intro-body" style="position: absolute; left: 50%; width: 480px; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; padding: 24px; background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
      <h2 id="intro-title" style="margin: 0; font-size: 19px; font-weight: 700">Cómo funciona la escritura</h2>
      <div id="intro-body" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.45; color: var(--ink)">
        <p style="margin: 0">Traza el carácter trazo a trazo. Si un trazo no es correcto, verás cuál era.</p>
        <p style="margin: 0"><strong>Al terminar, eliges tú cómo de bien lo sabías:</strong> Otra vez, Difícil, Bien o Fácil. Eso decide cuándo vuelve a salir.</p>
        <p style="margin: 0">Si prefieres que la app lo valore sola según tus fallos y pistas, activa <strong>Valoración automática</strong> en Ajustes de estudio. Puedes cambiarlo cuando quieras.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button onClick="{{ closeIntro }}" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--jade); color: var(--on-jade); text-decoration: none; font-size: 16px; font-weight: 600; border: 0; font: inherit; font-size: 16px; font-weight: 600">Entendido, valoro yo</button>
        <button onClick="{{ enableAuto }}" style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Activar valoración automática</button>
      </div>
      <span style="font-size: 12px; color: var(--ink-2)">Solo se muestra la primera vez que practicas escritura.</span>
    </section>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { panel: false, mode: 'atenuado', opacity: 40, size: 'M', color: 'pinyin', autoAudio: false, guide: 'contorno', autoRate: false, intro: true };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;
    const on = 'background: var(--jade-tint); color: var(--ink); border-color: var(--jade); font-weight: 600';
    const off = 'background: var(--surface); color: var(--ink)';
    const group = (key, list) => list.map(([id, label]) => ({
      label, pressed: String(s[key] === id), style: s[key] === id ? on : off, pick: () => this.setState({ [key]: id })
    }));
    const TONE = { 1: 'var(--tone-1)', 2: 'var(--tone-2)', 3: 'var(--tone-3)', 4: 'var(--tone-4)', 5: 'var(--tone-5)' };
    const pc = (t) => (s.color === 'no' ? 'var(--ink-2)' : TONE[t]);
    const hc = (t) => (s.color === 'ambos' ? TONE[t] : 'var(--ink)');
    return { tema: __tema, 
      panelOpen: s.panel,
      panelExpanded: String(s.panel),
      togglePanel: () => this.setState({ panel: !s.panel }),
      sizes: group('size', [['S', 'Pequeño'], ['M', 'Normal'], ['L', 'Grande']]),
      modes: group('mode', [['mostrar', 'Mostrar'], ['atenuado', 'Atenuado'], ['ocultar', 'Ocultar']]),
      colorModes: group('color', [['no', 'Sin color'], ['pinyin', 'Pinyin'], ['ambos', 'Pinyin y caracteres']]),
      opacity: s.opacity,
      setOpacity: (e) => this.setState({ opacity: Number(e.target.value) }),
      showSlider: s.mode === 'atenuado',
      pinyinHidden: s.mode === 'ocultar',
      rtVis: s.mode === 'ocultar' ? 'hidden' : 'visible',
      pinyinOpacity: s.mode === 'mostrar' ? 1 : s.opacity / 100,
      charSize: s.size === 'S' ? 60 : s.size === 'L' ? 104 : 80,
      colorsOn: s.color !== 'no',
      pc1: pc(1), pc2: pc(2), pc3: pc(3), pc4: pc(4), pc5: pc(5),
      hc1: hc(1), hc2: hc(2), hc3: hc(3), hc4: hc(4), hc5: hc(5),
      guides: group('guide', [['sin', 'Sin guía'], ['contorno', 'Contorno'], ['trazo', 'Siguiente trazo']]),
      showOutline: s.guide === 'contorno',
      showNext: s.guide === 'trazo',
      autoAudio: s.autoAudio,
      toggleAudio: () => this.setState({ autoAudio: !s.autoAudio }),
      autoRate: s.autoRate,
      manualRate: !s.autoRate,
      toggleRate: () => this.setState({ autoRate: !s.autoRate }),
      introOpen: s.intro,
      closeIntro: () => this.setState({ intro: false }),
      enableAuto: () => this.setState({ intro: false, autoRate: true })
    };
  }
}
</script>
</body>
</html>
