<body style="margin:0">

<template id="dc-template">
<div class="lx {{ fontClass }}" data-theme="{{ tema }}" style="min-height: 860px; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex">
  <nav aria-label="Navegación principal" style="width: 248px; flex: none; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px">

    <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Hoy</a>
    <span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">PRACTICAR</span>
    <a href="C-DTarjeta.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h12v13H4zM8 4h12v13"/></svg>Tarjetas</a><a href="C-DEscritura.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Escritura</a><a href="C-DTonos.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12c3-6 5-6 8 0s5 6 8 0 3-3 4-2"/></svg>Tonos</a><a href="C-DGramatica.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h8v8H3zM13 13h8v8h-8zM13 7h8M7 13v8"/></svg>Gramática</a><a href="C-DLecturas.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v14"/></svg>Lecturas</a><a href="C-DListas.dc.html" aria-current="page" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: var(--surface-sunken); text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>Mis listas</a>
    <div style="height: 1px; background: var(--surface-sunken); margin: 12px 4px"></div>
    <a href="C-DProgreso.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
    <a href="C-DPerfil.dc.html" aria-label="Perfil de adri: cuenta y ajustes" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)"><span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">adri</span><span style="font-size: 12px; color: var(--ink-2)">Perfil y ajustes</span></span></a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 40px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px"><div style="display: flex; flex-direction: column; gap: 4px"><a href="C-DListas.dc.html" style="font-size: 14px; color: var(--jade)">‹ Mis listas</a><h1 style="margin: 0; font-size: 26px; font-weight: 700">Importar caracteres</h1></div><div style="display: flex; gap: 8px"><a class="lx-btn lx-btn--secondary" href="C-DListas.dc.html" style="min-height: 44px">Cancelar</a><a class="lx-btn lx-btn--primary" href="C-DListas.dc.html" style="min-height: 44px">Importar 4 elementos</a></div></header><div style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 24px; align-items: start">
      <section aria-label="Datos de la importación" style="padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 16px"><div class="lx-segmented" role="group" aria-label="Cómo importar" style="display: grid"><button aria-pressed="true">Pegar lista</button><button aria-pressed="false">Subir CSV o JSON</button></div>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 13px/18px var(--font-sans)">Nombre del conjunto<input value="[Clase del jueves]" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink)"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 13px/18px var(--font-sans)">Caracteres o palabras<textarea lang="zh-Hans" rows="3" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink); padding: 10px 12px; font-family: var(--font-kai); font-size: 20px; resize: vertical">租 银 作业 黑板 𠮷</textarea></label>
      <span style="font: 400 13px/18px var(--font-sans); color: var(--ink-2)">Separa con espacios o saltos de línea. En CSV o JSON puedes añadir pinyin y significado.</span></section>
      <div style="display: flex; flex-direction: column; gap: 12px"><h2 class="lx-list__heading" style="margin: 0">Vista previa · 5 elementos</h2><ul class="lx-list" aria-label="Vista previa de la importación"><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t1" style="font: 400 24px/1 var(--font-kai)">租</span><span class="lx-row__text"><span class="lx-row__title">租 zū · alquilar</span><span class="lx-row__desc">Ya está en el HSK 1: comparte progreso</span></span><span style="color: var(--jade)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t2" style="font: 400 24px/1 var(--font-kai)">银</span><span class="lx-row__text"><span class="lx-row__title">银 yín · plata</span><span class="lx-row__desc">Pinyin, trazos y significado completados</span></span><span style="color: var(--jade)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t4" style="font: 400 22px/1 var(--font-kai)">作业</span><span class="lx-row__text"><span class="lx-row__title">作业 zuòyè · deberes</span><span class="lx-row__desc">Pinyin y trazos completados</span></span><span style="color: var(--jade)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4); align-items: flex-start"><span lang="zh-Hans" class="t1" style="font: 400 22px/1 var(--font-kai)">黑板</span><span class="lx-row__text"><span class="lx-row__title">黑板 hēibǎn</span><span class="lx-row__desc">Falta el significado en español (CC-CEDICT: blackboard)</span><input aria-label="Significado de 黑板" placeholder="Escribe el significado" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink); min-height: 40px; margin-top: 6px"></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" style="font: 400 24px/1 var(--font-kai)">𠮷</span><span class="lx-row__text"><span class="lx-row__title">𠮷 jí</span><span class="lx-row__desc">Sin datos de trazos: no entra en escritura</span></span><span style="color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 21h20zM12 10v5M12 18v.01"/></svg></span></li></ul><p style="margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-sunken); font: 400 14px/20px var(--font-sans); color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"/></svg> Solo tú ves este conjunto. Entra en tus palabras nuevas con las mismas prácticas que el HSK.</p></div>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-props='{"tema": {"editor": "enum", "options": ["claro", "oscuro"], "default": "claro", "section": "Tema"}, "letra": {"editor": "enum", "options": ["Kai", "Sans", "Song"], "default": "Kai", "section": "Tema"}, "$preview": {"width": 1280, "height": 860}}'>
class Component extends DCLogic {
  renderVals() {
    const letra = this.props.letra ?? 'Kai';
    return {
      tema: this.props.tema ?? 'claro',
      fontClass: letra === 'Sans' ? 'lx-font-hei' : letra === 'Song' ? 'lx-font-song' : ''
    };
  }
}
</script>
</body>
</html>
