<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecturas: lista (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="min-height: 860px; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-wrap: wrap">

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Navegación principal" style="flex: 1 1 220px; max-width: 248px; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 16px 12px">
        <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; display: grid; place-items: center; border: 2.5px solid var(--jade); border-radius: 4px; color: var(--jade); font: 900 15px/1 'Noto Serif SC', serif">词</span>Lexis</span>
        <button aria-label="Ocultar menú" aria-expanded="true" onClick="{{ toggle }}" style="width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      </div>
      <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Hoy</a>
      <span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">PRACTICAR</span>
      <sc-for list="{{ practice }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" aria-current="{{ it.cur }}" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); {{ it.bg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{ it.d }}"/></svg>{{ it.label }}</a>
      </sc-for>
      <div style="height: 1px; background: var(--surface-sunken); margin: 12px 4px"></div>
      <a href="C-DProgreso.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
      <a href="C-DInicio.dc.html" aria-label="Perfil de adri: cuenta y ajustes" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
        <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 14px; font-weight: 600">adri</span>
          <span style="font-size: 12px; color: var(--ink-2)">Perfil y ajustes</span>
        </span>
      </a>
    </nav>
  </sc-if>

  <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Navegación principal" style="width: 64px; flex: none; box-sizing: border-box; padding: 20px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px">
      <button aria-label="Mostrar menú" aria-expanded="false" onClick="{{ toggle }}" style="width: 44px; height: 44px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
      <a href="C-DInicio.dc.html" aria-label="Hoy" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></a>
      <div style="width: 28px; height: 1px; background: var(--surface-sunken); margin: 8px 0"></div>
      <sc-for list="{{ practice }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" aria-current="{{ it.cur }}" aria-label="{{ it.label }}" title="{{ it.label }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2); {{ it.bg }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{ it.d }}"/></svg></a>
      </sc-for>
      <div style="width: 28px; height: 1px; background: var(--surface-sunken); margin: 8px 0"></div>
      <a href="C-DProgreso.dc.html" aria-label="Progreso" title="Progreso" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
      <a href="C-DInicio.dc.html" aria-label="Perfil y ajustes" title="Perfil y ajustes" style="margin-top: auto; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</a>
    </nav>
  </sc-if>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
    <div style="max-width: 880px; width: 100%; display: flex; flex-direction: column; gap: 20px">
      <header style="display: flex; align-items: center; gap: 12px"><h1 style="flex: 1; margin: 0; font-size: 28px; font-weight: 700">Lecturas</h1><a href="C-DTextoNuevo.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Añadir mi texto</a></header>
      <a href="C-DLectura.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; border-radius: 10px; background: var(--jade); color: var(--on-jade); text-decoration: none">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--on-jade)">RECOMENDADA PARA TI</span>
        <span style="font-size: 18px; font-weight: 600">En la tienda</span>
        <span style="font-size: 14px; color: var(--on-jade)">Conoces el [95] % de sus palabras · unos [2] min</span>
      </a>
      <div role="group" aria-label="Filtrar lecturas" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
          <button aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 20px; font: inherit; font-size: 14px; {{ f.style }}; background: var(--surface)">{{ f.label }}</button>
        </sc-for>
      </div>
      <section aria-labelledby="r-hsk1" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 id="r-hsk1" style="margin: 0; font-size: 16px; font-weight: 700">HSK 1 · ordenadas por palabras conocidas</h2>
        </div>
        <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px">
          <li><a href="C-DLectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 22px; line-height: 1.8"><span style="color: {{ hc4 }}">在</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">zài</rt><span style="color: {{ hc1 }}">商</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc1 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">shāng</rt><span style="color: {{ hc4 }}">店</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">diàn</rt></ruby><span style="font-size: 14px; font-weight: 700">95 %</span></span>
            <span style="font-size: 15px; font-weight: 600">En la tienda</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 95%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">95 % de palabras conocidas · [5] frases · [1] palabra nueva · Sin leer</span>
          </a></li>
          <li><a href="C-DLectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 22px; line-height: 1.8"><span style="color: {{ hc3 }}">我</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc3 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">wǒ</rt><span style="color: {{ hc5 }}">的</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">de</rt><span style="color: {{ hc2 }}">朋</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc2 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">péng</rt><span style="color: {{ hc5 }}">友</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">you</rt></ruby><span style="font-size: 14px; font-weight: 700">92 %</span></span>
            <span style="font-size: 15px; font-weight: 600">Mi amigo</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 92%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">92 % de palabras conocidas · [6] frases · [2] palabras nuevas · Sin leer</span>
          </a></li>
          <li><a href="C-DLectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 22px; line-height: 1.8"><span style="color: {{ hc3 }}">我</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc3 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">wǒ</rt><span style="color: {{ hc5 }}">的</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">de</rt><span style="color: {{ hc1 }}">家</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc1 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">jiā</rt></ruby><span style="font-size: 14px; font-weight: 700">100 %</span></span>
            <span style="font-size: 15px; font-weight: 600">Mi familia</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">100 % de palabras conocidas · [4] frases · Leída · [3] de [3]</span>
          </a></li>
          <li><a href="C-DLectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 22px; line-height: 1.8"><span style="color: {{ hc4 }}">在</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">zài</rt><span style="color: {{ hc2 }}">学</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc2 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">xué</rt><span style="color: {{ hc4 }}">校</span><rt style="font-family: var(--font-sans); font-size: 11px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">xiào</rt></ruby><span style="font-size: 14px; font-weight: 700">61 %</span></span>
            <span style="font-size: 15px; font-weight: 600">En el colegio</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 61%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">61 % de palabras conocidas · [8] frases · [9] palabras nuevas · Sin leer · muchas palabras nuevas</span>
          </a></li>
        </ul>
        <span style="font-size: 12px; color: var(--ink-2)">Todas están disponibles. Recomendamos las que tienen al menos un [90] % de palabras que ya conoces.</span>
      </section>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const open = this.state.open;
    const s = this.state;
    const TONE = { 1: 'var(--tone-1)', 2: 'var(--tone-2)', 3: 'var(--tone-3)', 4: 'var(--tone-4)', 5: 'var(--tone-5)' };
    return { tema: __tema, 
      expanded: open,
      collapsed: !open,
      toggle: () => this.setState({ open: !open }),
      pc1: TONE[1], pc2: TONE[2], pc3: TONE[3], pc4: TONE[4], pc5: TONE[5],
      hc1: 'var(--ink)', hc2: 'var(--ink)', hc3: 'var(--ink)', hc4: 'var(--ink)', hc5: 'var(--ink)',
      pinyinOpacity: 1, rtVis: 'visible',
      filters: [['todas', 'Todas'], ['sin', 'Sin leer'], ['leidas', 'Leídas']].map(([id, label]) => ({
        label, pressed: String((s.filter || 'todas') === id),
        style: (s.filter || 'todas') === id ? 'background: var(--jade); color: var(--surface); border-color: var(--jade)' : 'background: var(--surface); color: var(--ink)',
        pick: () => this.setState({ filter: id })
      })),
      practice: [
        { label: 'Tarjetas', href: 'C-DInicio.dc.html', cur: 'false', bg: '', d: 'M4 7h12v13H4zM8 4h12v13' },
        { label: 'Escritura', href: 'C-DEscritura.dc.html', cur: 'false', bg: '', d: 'M4 20h4L19 9l-4-4L4 16z' },
        { label: 'Tonos', href: 'C-DTonos.dc.html', cur: 'false', bg: '', d: 'M2 12c3-6 5-6 8 0s5 6 8 0 3-3 4-2' },
        { label: 'Gramática', href: 'C-DGramatica.dc.html', cur: 'false', bg: '', d: 'M3 3h8v8H3zM13 13h8v8h-8zM13 7h8M7 13v8' },
        { label: 'Lecturas', href: 'C-DLecturas.dc.html', cur: 'page', bg: 'background: var(--surface-sunken); font-weight: 600', d: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v14' },
        { label: 'Mis listas', href: 'C-DInicio.dc.html', cur: 'false', bg: '', d: 'M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1' }
      ]
    };
  }
}
</script>
</body>
</html>
