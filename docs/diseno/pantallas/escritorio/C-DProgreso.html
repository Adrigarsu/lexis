<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progreso (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="min-height: 860px; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-wrap: wrap">

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Navegación principal" style="flex: 1 1 220px; max-width: 248px; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 16px 12px">
        <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; display: grid; place-items: center; border: 2.5px solid var(--jade); border-radius: 4px; color: var(--jade); font: 900 15px/1 'Noto Serif SC', serif">词</span>Lexis</span>
        <button aria-label="Ocultar menú" aria-expanded="true" onClick="{{ toggle }}" style="width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      </div>
      <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Hoy</a>
      <span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">PRACTICAR</span>
      <sc-for list="{{ practice }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" aria-current="{{ it.cur }}" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); {{ it.bg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{ it.d }}"/></svg>{{ it.label }}</a>
      </sc-for>
      <div style="height: 1px; background: var(--surface-sunken); margin: 12px 4px"></div>
      <a href="C-DProgreso.dc.html" aria-current="page" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); background: var(--surface-sunken); font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
      <a href="C-DInicio.dc.html" aria-label="Perfil de adri: cuenta y ajustes" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
        <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 14px; font-weight: 600">adri</span>
          <span style="font-size: 12px; color: var(--ink-2)">Perfil y ajustes</span>
        </span>
      </a>
    </nav>
  </sc-if>

  <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Navegación principal" style="width: 64px; flex: none; box-sizing: border-box; padding: 20px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px">
      <button aria-label="Mostrar menú" aria-expanded="false" onClick="{{ toggle }}" style="width: 44px; height: 44px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
      <a href="C-DInicio.dc.html" aria-label="Hoy" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></a>
      <div style="width: 28px; height: 1px; background: var(--surface-sunken); margin: 8px 0"></div>
      <sc-for list="{{ practice }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.href }}" aria-current="{{ it.cur }}" aria-label="{{ it.label }}" title="{{ it.label }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-2); {{ it.bg }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{ it.d }}"/></svg></a>
      </sc-for>
      <div style="width: 28px; height: 1px; background: var(--surface-sunken); margin: 8px 0"></div>
      <a href="C-DProgreso.dc.html" aria-current="page" aria-label="Progreso" title="Progreso" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink); background: var(--surface-sunken)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
      <a href="C-DInicio.dc.html" aria-label="Perfil y ajustes" title="Perfil y ajustes" style="margin-top: auto; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</a>
    </nav>
  </sc-if>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px; background: var(--surface-sunken); display: flex; flex-direction: column; gap: 24px">
    <div style="max-width: 1080px; width: 100%; display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">Progreso</h1>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start">
      <section aria-labelledby="p-streak" style="padding: 16px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 12px; background: var(--surface)">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h2 id="p-streak" style="margin: 0; font-size: 16px; font-weight: 700">Racha</h2>
          <span style="font-size: 13px; color: var(--ink-2)">Mejor racha: [20] días</span>
        </div>
        <span style="font-size: 28px; font-weight: 700">[8] días seguidos</span>
        <span style="font-size: 13px; color: var(--ink-2)">Los días de descanso no rompen la racha. Te quedan [1] de [2] esta semana.</span>
        <div role="grid" aria-label="Noviembre de 2026" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px"><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">L</span><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">M</span><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">X</span><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">J</span><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">V</span><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">S</span><span role="columnheader" style="font-size: 11px; color: var(--ink-2); text-align: center">D</span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span role="gridcell" aria-label="1 de noviembre: descanso" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface); color: var(--ink-2); border: 1px dashed var(--line-strong)">1</span><span role="gridcell" aria-label="2 de noviembre: estudiado" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">2</span><span role="gridcell" aria-label="3 de noviembre: estudiado" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">3</span><span role="gridcell" aria-label="4 de noviembre: sin estudiar" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); text-decoration: line-through">4</span><span role="gridcell" aria-label="5 de noviembre: estudiado" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">5</span><span role="gridcell" aria-label="6 de noviembre: estudiado" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">6</span><span role="gridcell" aria-label="7 de noviembre: estudiado" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">7</span><span role="gridcell" aria-label="8 de noviembre: descanso" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface); color: var(--ink-2); border: 1px dashed var(--line-strong)">8</span><span role="gridcell" aria-label="9 de noviembre: estudiado" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--jade); color: var(--on-jade); border: 1px solid var(--jade)">9</span><span role="gridcell" aria-label="10 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">10</span><span role="gridcell" aria-label="11 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">11</span><span role="gridcell" aria-label="12 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">12</span><span role="gridcell" aria-label="13 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">13</span><span role="gridcell" aria-label="14 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">14</span><span role="gridcell" aria-label="15 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">15</span><span role="gridcell" aria-label="16 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">16</span><span role="gridcell" aria-label="17 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">17</span><span role="gridcell" aria-label="18 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">18</span><span role="gridcell" aria-label="19 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">19</span><span role="gridcell" aria-label="20 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">20</span><span role="gridcell" aria-label="21 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">21</span><span role="gridcell" aria-label="22 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">22</span><span role="gridcell" aria-label="23 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">23</span><span role="gridcell" aria-label="24 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">24</span><span role="gridcell" aria-label="25 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">25</span><span role="gridcell" aria-label="26 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">26</span><span role="gridcell" aria-label="27 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">27</span><span role="gridcell" aria-label="28 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">28</span><span role="gridcell" aria-label="29 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">29</span><span role="gridcell" aria-label="30 de noviembre" style="aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--surface-sunken); color: var(--ink-2); border: 1px solid var(--line)">30</span></div>
        <div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2)">
          <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: var(--jade)"></span>Estudiado</span>
          <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; border: 1px dashed var(--line-strong); background: var(--surface)"></span>Descanso</span>
          <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface)"></span>Sin estudiar (tachado)</span>
        </div>
      </section>
      <section aria-labelledby="p-hsk" style="padding: 16px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 12px; background: var(--surface)">
        <h2 id="p-hsk" style="margin: 0; font-size: 16px; font-weight: 700">HSK 1</h2>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 28px; font-weight: 700">[86] de [300] palabras dominadas</span>
          <div aria-hidden="true" style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-sunken)"><span style="width: 29%; background: var(--jade)"></span><span style="width: 18%; background: var(--line-strong)"></span></div>
          <span style="font-size: 13px; color: var(--ink-2)">[86] dominadas · [54] aprendiendo · [160] sin empezar</span>
        </div>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <li style="display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; justify-content: space-between; font-size: 14px"><span>Significado · palabras</span><span style="font-weight: 600">[86] de [300]</span></span>
            <span style="display: flex"><span aria-hidden="true" style="flex: 1; height: 8px; border-radius: 4px; background: var(--surface-sunken)"><span style="display: block; width: 29%; height: 8px; border-radius: 4px; background: var(--jade-bright)"></span></span></span>
          </li>
          <li style="display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; justify-content: space-between; font-size: 14px"><span>Escritura · caracteres</span><span style="font-weight: 600">[40] de [246]</span></span>
            <span style="display: flex"><span aria-hidden="true" style="flex: 1; height: 8px; border-radius: 4px; background: var(--surface-sunken)"><span style="display: block; width: 16%; height: 8px; border-radius: 4px; background: var(--jade-bright)"></span></span></span>
          </li>
          <li style="display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; justify-content: space-between; font-size: 14px"><span>Escritura · palabras</span><span style="font-weight: 600">[12] de [300]</span></span>
            <span style="display: flex"><span aria-hidden="true" style="flex: 1; height: 8px; border-radius: 4px; background: var(--surface-sunken)"><span style="display: block; width: 4%; height: 8px; border-radius: 4px; background: var(--jade-bright)"></span></span></span>
          </li>
          <li style="display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; justify-content: space-between; font-size: 14px"><span>Pronunciación · palabras</span><span style="font-weight: 600">[30] de [300]</span></span>
            <span style="display: flex"><span aria-hidden="true" style="flex: 1; height: 8px; border-radius: 4px; background: var(--surface-sunken)"><span style="display: block; width: 10%; height: 8px; border-radius: 4px; background: var(--jade-bright)"></span></span></span>
          </li>
        </ul>
        <span style="font-size: 12px; color: var(--ink-2)">Dominada: la recuerdas aunque pasen 3 semanas sin verla.</span>
      </section>
      <section aria-labelledby="p-time" style="padding: 16px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 12px; background: var(--surface)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h2 id="p-time" style="margin: 0; font-size: 16px; font-weight: 700">Tiempo estudiado</h2>
          <div role="group" aria-label="Periodo" style="display: flex; gap: 4px">
            <sc-for list="{{ periods }}" as="p" hint-placeholder-count="3"><button aria-pressed="{{ p.pressed }}" onClick="{{ p.pick }}" style="min-height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 18px; font: inherit; font-size: 13px; {{ p.style }}; background: var(--surface)">{{ p.label }}</button></sc-for>
          </div>
        </div>
        <span style="font-size: 28px; font-weight: 700">{{ total }}</span>
