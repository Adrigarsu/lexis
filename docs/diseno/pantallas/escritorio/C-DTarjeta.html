<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de significado (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5C50}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx {{ toneClass }} {{ fontClass }}" data-theme="{{ tema }}" style="position: relative; min-height: 860px; box-sizing: border-box; overflow: hidden; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; --lx-pinyin-opacity: {{ pinyinOpacity }}">
  <header style="display: flex; align-items: center; justify-content: center; padding: var(--space-5) var(--space-6)">
    <div style="width: 100%; max-width: 720px; display: flex; align-items: center; gap: var(--space-4)">
      <a class="lx-btn lx-btn--icon" href="C-DInicio.dc.html" aria-label="Salir de la sesión"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
      <div class="lx-progress lx-progress--thin" style="flex: 1">
        <div class="lx-progress__head"><span>Repaso · [7] de [23]</span><span>unos [11] min</span></div>
        <div class="lx-progress__track" role="progressbar" aria-label="Progreso de la sesión" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"><div class="lx-progress__fill" style="width: 30%"></div></div>
      </div>
      <button class="lx-btn lx-btn--secondary" aria-haspopup="dialog" onClick="{{ openSheet }}" style="min-height: 44px; padding: 0 var(--space-4); font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes de estudio</button>
    </div>
  </header>
  <main style="flex: 1; display: flex; justify-content: center; padding: var(--space-4) var(--space-6) var(--space-10)">
    <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: var(--space-5)">
      <section class="lx-study" aria-label="Tarjeta de significado" style="min-height: 520px; justify-content: center; padding: var(--space-10) var(--space-8); gap: var(--space-4)">
        <span class="lx-study__kind">Significado</span>
        <ruby class="lx-hz" lang="zh-Hans" style="font-size: {{ heroSize }}px; line-height: 1.1"><span class="t3">打</span><rt class="t3" lang="zh-Latn-pinyin" style="font-size: 28px; font-weight: 600; visibility: {{ rtVis }}">dǎ</rt></ruby>
      <sc-if value="{{ pinyinHidden }}" hint-placeholder-val="{{ false }}">
        <span class="lx-study__note">Pinyin oculto · mantén pulsado para verlo</span>
      </sc-if>
      <div class="lx-study__audio">
        <button class="lx-btn lx-btn--audio" aria-label="Escuchar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
        <button class="lx-btn lx-btn--secondary" style="min-height: 44px; padding: 0 var(--space-4); font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M16 9.5h5M16 14.5h5"/></svg>Más lento</button>
      </div>
        <sc-if value="{{ shown }}" hint-placeholder-val="{{ false }}">
          <div class="lx-study__divider"></div>
          <span style="font: 600 26px/32px var(--font-sans)">pegar, golpear</span>
          <span class="lx-chip">verbo</span>
          <div style="width: 100%; max-width: 480px; margin-top: var(--space-2); padding: var(--space-2) var(--space-4) var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center">
            <ruby class="lx-hz" lang="zh-Hans" style="font-size: 26px; line-height: 2.1"><span class="t1">他</span><rt class="t1" style="font-size: 13px; visibility: {{ rtVis }}">tā</rt><span class="t3">打</span><rt class="t3" style="font-size: 13px; visibility: {{ rtVis }}">dǎ</rt><span class="t3">我</span><rt class="t3" style="font-size: 13px; visibility: {{ rtVis }}">wǒ</rt>。</ruby>
            <span style="font: 400 15px/22px var(--font-sans)">Él me pega.</span>
          </div>
          <a class="lx-btn lx-btn--text" href="C-Reportar.dc.html" style="min-height: 40px; font: 500 13px/18px var(--font-sans); color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>Reportar un error</a>
        </sc-if>
      </section>
      <sc-if value="{{ hidden }}" hint-placeholder-val="{{ true }}">
        <button class="lx-btn lx-btn--primary lx-btn--block" onClick="{{ reveal }}">Mostrar respuesta <kbd style="font: 500 12px/16px var(--font-sans); padding: 1px 6px; border: var(--border-hair) solid currentColor; border-radius: 4px; opacity: 0.85">Espacio</kbd></button>
      </sc-if>
      <sc-if value="{{ shown }}" hint-placeholder-val="{{ false }}">
        <div class="lx-rate lx-rate--keys" role="group" aria-label="¿Cómo de bien lo sabías?">
          <a href="C-DResumen.dc.html" data-r="1"><span>Otra vez</span><small>&lt; 1 min</small><kbd>1</kbd></a>
          <a href="C-DResumen.dc.html" data-r="2"><span>Difícil</span><small>[6] min</small><kbd>2</kbd></a>
          <a href="C-DResumen.dc.html" data-r="3"><span>Bien</span><small>[1] día</small><kbd>3</kbd></a>
          <a href="C-DResumen.dc.html" data-r="4"><span>Fácil</span><small>[4] días</small><kbd>4</kbd></a>
        </div>
      </sc-if>
    </div>
  </main>
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <button class="lx-scrim" aria-label="Cerrar ajustes de estudio" onClick="{{ closeSheet }}" style="position: absolute; inset: 0; border: 0"></button>
    <section class="lx-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; top: 0; right: 0; bottom: 0; width: 400px; border-radius: 0; border: 0; border-left: var(--border-hair) solid var(--line); padding-top: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); padding-bottom: var(--space-8)">
      <div class="lx-sheet__head">
        <h2 class="lx-sheet__title" id="sheet-title">Ajustes de estudio</h2>
        <button class="lx-btn lx-btn--text" onClick="{{ closeSheet }}" style="min-height: 44px">Listo</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-2)">
        <span id="s-size" class="lx-field__label">Tamaño de los caracteres</span>
        <div class="lx-segmented" role="group" aria-labelledby="s-size" style="display: grid">
          <sc-for list="{{ sizes }}" as="o" hint-placeholder-count="3"><button aria-pressed="{{ o.pressed }}" onClick="{{ o.pick }}">{{ o.label }}</button></sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-2)">
        <span id="s-pinyin" class="lx-field__label">Pinyin</span>
        <div class="lx-segmented" role="group" aria-labelledby="s-pinyin" style="display: grid">
          <sc-for list="{{ modes }}" as="o" hint-placeholder-count="3"><button aria-pressed="{{ o.pressed }}" onClick="{{ o.pick }}">{{ o.label }}</button></sc-for>
        </div>
        <sc-if value="{{ showSlider }}" hint-placeholder-val="{{ true }}">
          <label for="s-opacity" style="display: flex; justify-content: space-between; font: 400 14px/20px var(--font-sans); color: var(--ink-2)">Opacidad <span>{{ opacity }} %</span></label>
          <input id="s-opacity" type="range" min="10" max="90" step="10" value="{{ opacity }}" onChange="{{ setOpacity }}" style="width: 100%; height: 32px; accent-color: var(--jade-bright)">
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-2)">
        <span id="s-color" class="lx-field__label">Colores según el tono</span>
        <div class="lx-segmented" role="group" aria-labelledby="s-color" style="display: grid">
          <sc-for list="{{ colorModes }}" as="o" hint-placeholder-count="3"><button aria-pressed="{{ o.pressed }}" onClick="{{ o.pick }}" style="padding: 0 var(--space-2)">{{ o.label }}</button></sc-for>
        </div>
        <sc-if value="{{ colorsOn }}" hint-placeholder-val="{{ true }}">
          <div role="list" aria-label="Leyenda de colores por tono" style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
            <span role="listitem" class="lx-chip lx-chip--tone lx-chip--t1">1.º ā</span>
            <span role="listitem" class="lx-chip lx-chip--tone lx-chip--t2">2.º á</span>
            <span role="listitem" class="lx-chip lx-chip--tone lx-chip--t3">3.º ǎ</span>
            <span role="listitem" class="lx-chip lx-chip--tone lx-chip--t4">4.º à</span>
            <span role="listitem" class="lx-chip lx-chip--tone lx-chip--t5">neutro a</span>
          </div>
        </sc-if>
      </div>
      <label class="lx-switch">
        <span class="lx-switch__text"><span class="lx-switch__title">Audio automático al girar</span></span>
        <input type="checkbox" role="switch" checked="{{ autoAudio }}" onChange="{{ toggleAudio }}">
      </label>
      <span style="font: 400 13px/18px var(--font-sans); color: var(--ink-2)">Se guarda para todas tus sesiones. Más opciones en Perfil › Ajustes.</span>
    </section>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"letra":{"editor":"enum","options":["Kai","Sans","Song"],"default":"Kai","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: false, mode: 'mostrar', opacity: 40, size: 'M', color: 'pinyin', autoAudio: false };
  }
  renderVals() {
    const s = this.state;
    const group = (key, list) => list.map(([id, label]) => ({
      label, pressed: String(s[key] === id), pick: () => this.setState({ [key]: id })
    }));
    const letra = this.props.letra ?? 'Kai';
    return {
      tema: this.props.tema ?? 'claro',
      fontClass: letra === 'Sans' ? 'lx-font-hei' : letra === 'Song' ? 'lx-font-song' : '',
      toneClass: s.color === 'no' ? 'lx-tones-off' : s.color === 'ambos' ? 'lx-tones-all' : '',
      sheetOpen: s.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      sizes: group('size', [['S', 'Pequeño'], ['M', 'Normal'], ['L', 'Grande']]),
      modes: group('mode', [['mostrar', 'Mostrar'], ['atenuado', 'Atenuado'], ['ocultar', 'Ocultar']]),
      colorModes: group('color', [['no', 'Sin color'], ['pinyin', 'Pinyin'], ['ambos', 'Ambos']]),
      opacity: s.opacity,
      setOpacity: (e) => this.setState({ opacity: Number(e.target.value) }),
      showSlider: s.mode === 'atenuado',
      pinyinHidden: s.mode === 'ocultar',
      rtVis: s.mode === 'ocultar' ? 'hidden' : 'visible',
      pinyinOpacity: s.mode === 'atenuado' ? s.opacity / 100 : 1,
      heroSize: s.size === 'S' ? 96 : s.size === 'L' ? 160 : 128,
      colorsOn: s.color !== 'no',
      autoAudio: s.autoAudio,
      toggleAudio: () => this.setState({ autoAudio: !s.autoAudio }),
      shown: !!s.shown,
      hidden: !s.shown,
      reveal: () => this.setState({ shown: true })
    };
  }
}
</script>
</body>
</html>
