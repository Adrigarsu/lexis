<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Añadir mi texto (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx {{ fontClass }}" data-theme="{{ tema }}" style="min-height: 860px; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex">
  <nav aria-label="Navegación principal" style="width: 248px; flex: none; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; padding: 0 4px 16px 12px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; display: grid; place-items: center; border: 2.5px solid var(--jade); border-radius: 4px; color: var(--jade); font: 900 15px/1 'Noto Serif SC', serif">词</span>Lexis</span></div>
    <a href="C-DInicio.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Hoy</a>
    <span style="padding: 16px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-2)">PRACTICAR</span>
    <a href="C-DTarjeta.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h12v13H4zM8 4h12v13"/></svg>Tarjetas</a><a href="C-DEscritura.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Escritura</a><a href="C-DTonos.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12c3-6 5-6 8 0s5 6 8 0 3-3 4-2"/></svg>Tonos</a><a href="C-DGramatica.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h8v8H3zM13 13h8v8h-8zM13 7h8M7 13v8"/></svg>Gramática</a><a href="C-DLecturas.dc.html" aria-current="page" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: var(--surface-sunken); text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v14"/></svg>Lecturas</a><a href="C-DListas.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>Mis listas</a>
    <div style="height: 1px; background: var(--surface-sunken); margin: 12px 4px"></div>
    <a href="C-DProgreso.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: transparent; text-decoration: none; font-size: 14px; font-weight: 400; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
    <a href="C-DPerfil.dc.html" aria-label="Perfil de adri: cuenta y ajustes" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)"><span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--ink-2)">A</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">adri</span><span style="font-size: 12px; color: var(--ink-2)">Perfil y ajustes</span></span></a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 40px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px"><div style="display: flex; flex-direction: column; gap: 4px"><a href="C-DLecturas.dc.html" style="font-size: 14px; color: var(--jade)">‹ Lecturas</a><h1 style="margin: 0; font-size: 26px; font-weight: 700">Añadir mi texto</h1></div><div style="display: flex; gap: 8px"><a class="lx-btn lx-btn--secondary" href="C-DLecturas.dc.html" style="min-height: 44px">Cancelar</a><a class="lx-btn lx-btn--primary" href="C-DLectura.dc.html" style="min-height: 44px">Guardar y leer</a></div></header><div style="display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 24px; align-items: start">
      <section aria-label="Texto" style="padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 16px"><label style="display: flex; flex-direction: column; gap: 6px; font: 600 13px/18px var(--font-sans)">Título<input value="[Mi diario del jueves]" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink)"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 13px/18px var(--font-sans)">Texto en chino<textarea lang="zh-Hans" rows="5" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink); padding: 10px 12px; font-family: var(--font-kai); font-size: 20px; line-height: 1.6; resize: vertical">今天我和朋友坐出租车去饭店。我们吃了很多菜，也喝了茶。</textarea></label>
      <span style="align-self: flex-end; font: 400 13px/18px var(--font-sans); color: var(--ink-2)">27 / 2.000 caracteres</span></section>
      <div style="display: flex; flex-direction: column; gap: 12px"><section aria-labelledby="pv" style="padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
        <h2 id="pv" style="margin: 0; font: 700 15px/20px var(--font-sans)">Antes de guardar</h2>
        <div class="lx-progress"><div class="lx-progress__head"><span>Conoces el [86] % de las palabras</span></div><div class="lx-progress__track" role="progressbar" aria-label="Palabras conocidas" aria-valuenow="86" aria-valuemin="0" aria-valuemax="100"><div class="lx-progress__fill" style="width: 86%"></div></div></div>
        <span style="font: 400 14px/20px var(--font-sans)">[2] palabras nuevas irán subrayadas: <span lang="zh-Hans" style="font-family: var(--font-kai)">饭店</span>, <span lang="zh-Hans" style="font-family: var(--font-kai)">菜</span>. Tócalas al leer para añadirlas a tus tarjetas.</span>
        <span style="font: 400 13px/18px var(--font-sans); color: var(--ink-2)">Sin preguntas de comprensión: es tu texto.</span>
      </section><p style="margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-sunken); font: 400 14px/20px var(--font-sans); color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"/></svg> Solo tú ves tus textos; nunca se publican ni se comparten.</p></div>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" data-props='{"tema": {"editor": "enum", "options": ["claro", "oscuro"], "default": "claro", "section": "Tema"}, "letra": {"editor": "enum", "options": ["Kai", "Sans", "Song"], "default": "Kai", "section": "Tema"}, "$preview": {"width": 1280, "height": 860}}'>
class Component extends DCLogic {
  renderVals() {
    const letra = this.props.letra ?? 'Kai';
    return {
      tema: this.props.tema ?? 'claro',
      fontClass: letra === 'Sans' ? 'lx-font-hei' : letra === 'Song' ? 'lx-font-song' : ''
    };
  }
}
</script>
</body>
</html>
