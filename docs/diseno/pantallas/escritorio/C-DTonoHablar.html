<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonos: pronunciar (escritorio) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="min-height: 860px; box-sizing: border-box; background: var(--surface-sunken); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <a href="C-DTonos.dc.html" style="min-height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Salir</a>
    <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: var(--ink-2)">Tonos · [5] de [10]</span>
      <div style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><div style="width: 50%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></div></div>
    </div>
    <button aria-haspopup="dialog" aria-expanded="{{ panelExpanded }}" onClick="{{ togglePanel }}" style="min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; font-size: 13px; font-weight: 600; color: var(--ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes de estudio</button>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap">
    <main style="flex: 999 1 560px; min-width: 0; padding: 40px 24px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2)">PRONUNCIA</span>
          <span style="font-size: 26px; font-weight: 600">gracias</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 64px; line-height: 1.5"><span style="color: {{ hc4 }}">谢</span><rt style="font-family: var(--font-sans); font-size: 18px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">xiè</rt><span style="color: {{ hc5 }}">谢</span><rt style="font-family: var(--font-sans); font-size: 18px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">xie</rt></ruby><button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Escuchar modelo · Espacio</button></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <button aria-label="{{ micLabel }}" aria-pressed="{{ micPressed }}" onClick="{{ mic }}" style="width: 104px; height: 104px; border: 2px solid var(--ink); border-radius: 52px; display: flex; align-items: center; justify-content: center; {{ micStyle }}; background: var(--surface)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: var(--ink-2)">Pulsa y di la palabra</span></sc-if>
      <sc-if value="{{ recording }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 14px; font-weight: 600">Escuchando… pulsa otra vez para terminar</span></sc-if>
    </div>
        </div>
        <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <section role="status" style="width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface)">
        <span style="font-size: 15px; font-weight: 700">Te ha entendido: <span lang="zh-Hans" style="font-family: var(--font-kai)">谢谢</span></span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap"><button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Tu voz</button><button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Modelo</button><button onClick="{{ again }}" style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Repetir</button></div>
      </section>
      <span id="hab-q" style="align-self: flex-start; font-size: 16px; font-weight: 600">¿Cómo de bien lo has dicho?</span>
      <div role="group" aria-labelledby="hab-q" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%"><a href="{{ next }}" style="min-height: 60px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">Otra vez · 1</span><span style="font-size: 12px; color: var(--ink-2)">[&lt;10 min]</span></a><a href="{{ next }}" style="min-height: 60px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">Difícil · 2</span><span style="font-size: 12px; color: var(--ink-2)">[1] día</span></a><a href="{{ next }}" style="min-height: 60px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">Bien · 3</span><span style="font-size: 12px; color: var(--ink-2)">[3] días</span></a><a href="{{ next }}" style="min-height: 60px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">Fácil · 4</span><span style="font-size: 12px; color: var(--ink-2)">[7] días</span></a></div>
    </sc-if>
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px">
          <span style="font-size: 12px; color: var(--ink-2)">R: grabar · 1-4: valorar</span>
          <a href="C-DTonos.dc.html" style="font-size: 14px; color: var(--ink-2)">Ahora no puedo hablar</a>
        </div>
      </div>
    </main>

    <sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ true }}">
      <aside role="dialog" aria-label="Ajustes de estudio" style="flex: 1 1 300px; max-width: 340px; box-sizing: border-box; padding: 24px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">Ajustes de estudio</h2>
          <button aria-label="Cerrar ajustes" onClick="{{ togglePanel }}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-size-label" style="font-size: 14px; font-weight: 600">1 · Tamaño de los caracteres</span>
          <div role="group" aria-labelledby="d-size-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="3">
              <button aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ s.style }}; background: var(--surface)">{{ s.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-pinyin-label" style="font-size: 14px; font-weight: 600">2 · Pinyin</span>
          <div role="group" aria-labelledby="d-pinyin-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
              <button aria-pressed="{{ m.pressed }}" onClick="{{ m.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ m.style }}; background: var(--surface)">{{ m.label }}</button>
            </sc-for>
          </div>
          <sc-if value="{{ showSlider }}" hint-placeholder-val="{{ true }}">
            <label for="d-opacity" style="display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2)">Opacidad <span>{{ opacity }} %</span></label>
            <input id="d-opacity" type="range" min="10" max="90" step="10" value="{{ opacity }}" onChange="{{ setOpacity }}" style="width: 100%; height: 36px">
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="d-color-label" style="font-size: 14px; font-weight: 600">3 · Colores según el tono</span>
          <div role="group" aria-labelledby="d-color-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{ colorModes }}" as="c" hint-placeholder-count="3">
              <button aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="min-height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ c.style }}; background: var(--surface)">{{ c.label }}</button>
            </sc-for>
          </div>
          <sc-if value="{{ colorsOn }}" hint-placeholder-val="{{ true }}">
            <div aria-label="Leyenda de colores por tono" style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2)">
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-1)"></span>1.º ā</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-2)"></span>2.º á</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-3)"></span>3.º ǎ</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-4)"></span>4.º à</span>
              <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--jade-bright)"></span>neutro</span>
            </div>
          </sc-if>
        </div>
        <label style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600">4 · Audio automático al girar <input type="checkbox" checked="{{ autoAudio }}" onChange="{{ toggleAudio }}" style="width: 20px; height: 20px"></label>
        <span style="margin-top: auto; font-size: 12px; color: var(--ink-2)">Se guarda para todas tus sesiones. Más opciones en Perfil › Ajustes.</span>
      </aside>
    </sc-if>
  </div>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { panel: false, mode: 'atenuado', opacity: 40, size: 'M', color: 'pinyin', autoAudio: false, phase: 'done' };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;
    const on = 'background: var(--jade-tint); color: var(--ink); border-color: var(--jade); font-weight: 600';
    const off = 'background: var(--surface); color: var(--ink)';
    const group = (key, list) => list.map(([id, label]) => ({
      label, pressed: String(s[key] === id), style: s[key] === id ? on : off, pick: () => this.setState({ [key]: id })
    }));
    const TONE = { 1: 'var(--tone-1)', 2: 'var(--tone-2)', 3: 'var(--tone-3)', 4: 'var(--tone-4)', 5: 'var(--tone-5)' };
    const pc = (t) => (s.color === 'no' ? 'var(--ink-2)' : TONE[t]);
    const hc = (t) => (s.color === 'ambos' ? TONE[t] : 'var(--ink)');
    return { tema: __tema, 
      panelOpen: s.panel,
      panelExpanded: String(s.panel),
      togglePanel: () => this.setState({ panel: !s.panel }),
      sizes: group('size', [['S', 'Pequeño'], ['M', 'Normal'], ['L', 'Grande']]),
      modes: group('mode', [['mostrar', 'Mostrar'], ['atenuado', 'Atenuado'], ['ocultar', 'Ocultar']]),
      colorModes: group('color', [['no', 'Sin color'], ['pinyin', 'Pinyin'], ['ambos', 'Pinyin y caracteres']]),
      opacity: s.opacity,
      setOpacity: (e) => this.setState({ opacity: Number(e.target.value) }),
      showSlider: s.mode === 'atenuado',
      pinyinHidden: s.mode === 'ocultar',
      rtVis: s.mode === 'ocultar' ? 'hidden' : 'visible',
      pinyinOpacity: s.mode === 'mostrar' ? 1 : s.opacity / 100,
      charSize: s.size === 'S' ? 60 : s.size === 'L' ? 104 : 80,
      colorsOn: s.color !== 'no',
      pc1: pc(1), pc2: pc(2), pc3: pc(3), pc4: pc(4), pc5: pc(5),
      hc1: hc(1), hc2: hc(2), hc3: hc(3), hc4: hc(4), hc5: hc(5),
      autoAudio: s.autoAudio,
      toggleAudio: () => this.setState({ autoAudio: !s.autoAudio }),
      idle: s.phase === 'idle',
      recording: s.phase === 'rec',
      done: s.phase === 'done',
      micLabel: s.phase === 'rec' ? 'Terminar de grabar' : 'Grabar tu voz',
      micPressed: String(s.phase === 'rec'),
      micStyle: s.phase === 'rec' ? 'background: var(--jade); color: var(--surface)' : 'background: var(--surface); color: var(--ink)',
      mic: () => this.setState({ phase: s.phase === 'rec' ? 'done' : 'rec' }),
      again: () => this.setState({ phase: 'idle' }),
      next: 'C-DTonos.dc.html'
    };
  }
}
</script>
</body>
</html>
