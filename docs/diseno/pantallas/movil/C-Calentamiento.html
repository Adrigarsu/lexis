<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calentamiento de tonos (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px">
    <a href="C-Inicio.dc.html" aria-label="Salir de la sesión" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: var(--ink-2)">Calentamiento de tonos · [3] de [8] · [1:20] restante</span>
      <div style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><div style="width: 35%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></div></div>
    </div>
  </header>
  <main style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2)">¿QUÉ TONO OYES?</span>
    <button aria-label="Volver a escuchar la sílaba" style="width: 120px; height: 120px; border: 1px solid var(--line-strong); border-radius: 60px; background: var(--surface-sunken); color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); font: inherit; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Escuchar más lento</button>
    <span style="font-size: 20px; font-weight: 600">ma</span>
    <span style="font-size: 12px; color: var(--ink-2)">Sin color ni marca de tono hasta que respondas</span>
    <div role="group" aria-label="Elige el tono" style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; color: var(--ink)"><span style="font-size: 16px; font-weight: 600">1.º</span><span style="font-size: 11px; color: var(--ink-2)">alto y plano</span></button>
      <button style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; color: var(--ink)"><span style="font-size: 16px; font-weight: 600">2.º</span><span style="font-size: 11px; color: var(--ink-2)">sube</span></button>
      <button style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; color: var(--ink)"><span style="font-size: 16px; font-weight: 600">3.º</span><span style="font-size: 11px; color: var(--ink-2)">baja y sube</span></button>
      <button style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; color: var(--ink)"><span style="font-size: 16px; font-weight: 600">4.º</span><span style="font-size: 11px; color: var(--ink-2)">baja</span></button>
      <button style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; color: var(--ink)"><span style="font-size: 16px; font-weight: 600">Neutro</span><span style="font-size: 11px; color: var(--ink-2)">corto y suave</span></button>
    </div>
  </main>
  <footer style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="C-Ficha.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); text-decoration: none; font: inherit; font-size: 15px; font-weight: 600">Saltar el calentamiento</a>
    <span style="font-size: 12px; color: var(--ink-2); text-align: center">Se desactiva en Perfil › Estudio y metas</span>
  </footer>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    return { tema: __tema, };
  }
}
</script>
</body>
</html>
