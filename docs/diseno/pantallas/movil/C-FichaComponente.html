<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de componente nuevo (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">

</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx {{ fontClass }}" data-theme="{{ tema }}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--paper); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-2)">
    <a class="lx-btn lx-btn--icon" href="C-Inicio.dc.html" aria-label="Salir de la sesión"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <div class="lx-progress lx-progress--thin" style="flex: 1">
      <div class="lx-progress__head"><span>Componente nuevo · [1] de [5]</span></div>
      <div class="lx-progress__track" role="progressbar" aria-label="Progreso de la sesión" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"><div class="lx-progress__fill" style="width: 20%"></div></div>
    </div>
    <button class="lx-btn lx-btn--icon" aria-label="Ajustes de estudio" aria-haspopup="dialog" style="border-color: var(--line-strong)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/></svg></button>
  </header>
  <main style="flex: 1; min-height: 0; overflow: auto; padding: var(--space-2) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4)">
    <section class="lx-study" aria-label="Componente nuevo" style="padding: var(--space-5) var(--space-5) var(--space-4); gap: var(--space-2)">
      <span class="lx-study__kind">Componente nuevo</span>
      <ruby class="lx-hz" lang="zh-Hans" style="font-size: 80px; line-height: 1.1"><span class="t2">禾</span><rt class="t2" style="font-size: 20px; font-weight: 600">hé</rt></ruby>
      <span style="font: 600 22px/28px var(--font-sans)">cereal, planta de grano</span>
      <div style="display: flex; flex-wrap: wrap; gap: var(--space-2)"><span class="lx-chip">componente</span><span class="lx-chip">5 trazos</span></div>
      <span class="lx-study__note">Suele ir a la izquierda del carácter. Se usa también como carácter suelto, así que tiene las tres prácticas.</span>
      <div class="lx-study__audio"><button class="lx-btn lx-btn--audio" aria-label="Escuchar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg></button><button class="lx-btn lx-btn--secondary" style="min-height: 44px; padding: 0 var(--space-4); font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM16 9.5h5M16 14.5h5"/></svg>Más lento</button></div>
    </section>
    <section style="display: flex; flex-direction: column; gap: var(--space-2)"><h2 class="lx-list__heading" style="margin: 0">Trazos</h2><button class="lx-card" aria-label="Ver la animación de los 5 trazos de 禾" style="flex-direction: row; align-items: center; gap: var(--space-4); padding: var(--space-3); cursor: pointer; font: inherit; color: inherit; text-align: left"><span class="lx-tianzige" aria-hidden="true" style="width: 80px; flex: none; display: block"><svg viewBox="0 0 300 300"><path class="guide" d="M150 0V300M0 150H300" style="stroke-dasharray: 8 8"/></svg><svg viewBox="0 0 1024 1024"><g transform="translate(0 900) scale(1 -1)" style="fill: var(--ink)"><path d="M 510 721 Q 597 751 654 756 Q 673 755 679 763 Q 685 775 672 789 Q 650 810 602 834 Q 586 844 570 845 Q 561 841 559 829 Q 553 781 290 693 Q 283 683 290 680 L 456 707 L 510 721 Z"/><path d="M 537 505 Q 634 523 792 539 Q 805 538 816 553 Q 817 566 790 579 Q 745 606 673 582 Q 609 567 544 553 Q 541 553 539 551 L 487 541 Q 379 526 202 506 Q 168 502 193 481 Q 230 453 256 455 Q 280 464 450 491 L 537 505 Z"/><path d="M 536 480 Q 536 493 537 505 L 539 551 Q 542 612 555 656 Q 564 671 561 685 Q 554 694 510 721 C 485 737 440 733 456 707 Q 484 667 485 623 Q 486 584 487 541 L 487 425 Q 484 202 478 162 Q 459 53 460 46 Q 460 34 479 -10 Q 486 -28 494 -31 Q 500 -38 508 -29 Q 515 -25 526 -4 Q 536 21 535 53 Q 534 93 536 433 L 536 480 Z"/><path d="M 450 491 Q 369 314 128 125 Q 113 112 125 109 Q 152 99 249 165 Q 337 222 487 425 C 547 506 473 538 450 491 Z"/><path d="M 536 433 Q 630 301 750 162 Q 772 137 809 139 Q 935 142 975 148 Q 987 151 989 157 Q 989 164 972 172 Q 824 223 747 279 Q 650 361 536 480 C 515 502 519 457 536 433 Z"/></g></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font: 600 15px/20px var(--font-sans)">5 trazos</span><span class="lx-card__meta" style="font-size: 13px">Ver animación del orden</span></span></button></section>
    <section style="display: flex; flex-direction: column; gap: var(--space-2)"><h2 class="lx-list__heading" style="margin: 0">Cómo se forma</h2><ul class="lx-list"><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t3" style="font: 400 24px/1 var(--font-kai)">丿</span><span class="lx-row__text"><span class="lx-row__title"><span lang="zh-Hans" style="font-family: var(--font-kai)">丿</span> trazo inclinado + <span lang="zh-Hans" style="font-family: var(--font-kai)">木</span> árbol</span><span class="lx-row__desc">Una espiga que cae sobre la planta</span></span></li></ul></section>
    <section style="display: flex; flex-direction: column; gap: var(--space-2)"><h2 class="lx-list__heading" style="margin: 0">Aparece en tus caracteres del HSK 1</h2><ul class="lx-list"><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t1" style="font: 400 24px/1 var(--font-kai)">租</span><span class="lx-row__text"><span class="lx-row__title">租 zū · alquilar</span><span class="lx-row__desc">El siguiente de la sesión</span></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t2" style="font: 400 24px/1 var(--font-kai)">和</span><span class="lx-row__text"><span class="lx-row__title">和 hé · y, con</span><span class="lx-row__desc">Ya lo conoces</span></span></li></ul></section>
  </main>
  <footer style="padding: var(--space-3) var(--space-5) var(--space-8)">
    <a class="lx-btn lx-btn--primary lx-btn--block" href="C-FichaCaracter.dc.html">Entendido, ahora 租</a>
  </footer>
</div>
</template>
<script type="text/x-dc" data-props='{"tema": {"editor": "enum", "options": ["claro", "oscuro"], "default": "claro", "section": "Tema"}, "letra": {"editor": "enum", "options": ["Kai", "Sans", "Song"], "default": "Kai", "section": "Tema"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const letra = this.props.letra ?? 'Kai';
    return {
      tema: this.props.tema ?? 'claro',
      fontClass: letra === 'Sans' ? 'lx-font-hei' : letra === 'Song' ? 'lx-font-song' : ''
    };
  }
}
</script>
</body>
</html>
