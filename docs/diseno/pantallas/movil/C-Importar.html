<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar mis caracteres (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;900&amp;display=swap">
<style>
body{margin:0}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx {{ fontClass }}" data-theme="{{ tema }}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--paper); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-2)">
    <a class="lx-btn lx-btn--icon" href="C-Listas.dc.html" aria-label="Volver a Mis listas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; font: 700 20px/26px var(--font-sans)">Importar caracteres</h1>
  </header>
  <main style="flex: 1; min-height: 0; overflow: auto; padding: var(--space-2) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4)">
    <div class="lx-segmented" role="group" aria-label="Cómo importar" style="display: grid"><button aria-pressed="true">Pegar lista</button><button aria-pressed="false">Subir CSV o JSON</button></div>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 13px/18px var(--font-sans)">Nombre del conjunto<input value="[Clase del jueves]" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink)"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font: 600 13px/18px var(--font-sans)">Caracteres o palabras<textarea lang="zh-Hans" rows="3" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink); padding: 10px 12px; font-family: var(--font-kai); font-size: 20px; resize: vertical">租 银 作业 黑板 𠮷</textarea></label>
      <span style="font: 400 13px/18px var(--font-sans); color: var(--ink-2)">Separa con espacios o saltos de línea. En CSV o JSON puedes añadir pinyin y significado.</span>
    <section style="display: flex; flex-direction: column; gap: var(--space-2)"><h2 class="lx-list__heading" style="margin: 0">Vista previa · 5 elementos</h2><ul class="lx-list" aria-label="Vista previa de la importación"><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t1" style="font: 400 24px/1 var(--font-kai)">租</span><span class="lx-row__text"><span class="lx-row__title">租 zū · alquilar</span><span class="lx-row__desc">Ya está en el HSK 1: comparte progreso</span></span><span style="color: var(--jade)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t2" style="font: 400 24px/1 var(--font-kai)">银</span><span class="lx-row__text"><span class="lx-row__title">银 yín · plata</span><span class="lx-row__desc">Pinyin, trazos y significado completados</span></span><span style="color: var(--jade)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" class="t4" style="font: 400 22px/1 var(--font-kai)">作业</span><span class="lx-row__text"><span class="lx-row__title">作业 zuòyè · deberes</span><span class="lx-row__desc">Pinyin y trazos completados</span></span><span style="color: var(--jade)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4); align-items: flex-start"><span lang="zh-Hans" class="t1" style="font: 400 22px/1 var(--font-kai)">黑板</span><span class="lx-row__text"><span class="lx-row__title">黑板 hēibǎn</span><span class="lx-row__desc">Falta el significado en español (CC-CEDICT: blackboard)</span><input aria-label="Significado de 黑板" placeholder="Escribe el significado" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: var(--surface); color: var(--ink); min-height: 40px; margin-top: 6px"></span></li><li class="lx-row" style="min-height: 52px; padding: var(--space-2) var(--space-4)"><span lang="zh-Hans" style="font: 400 24px/1 var(--font-kai)">𠮷</span><span class="lx-row__text"><span class="lx-row__title">𠮷 jí</span><span class="lx-row__desc">Sin datos de trazos: no entra en escritura</span></span><span style="color: var(--ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 21h20zM12 10v5M12 18v.01"/></svg></span></li></ul></section>
    <p style="margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-sunken); font: 400 14px/20px var(--font-sans); color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"/></svg> Solo tú ves este conjunto. Entra en tus palabras nuevas con las mismas prácticas que el HSK.</p>
  </main>
  <footer style="padding: var(--space-3) var(--space-5) var(--space-8); border-top: 1px solid var(--line); background: var(--paper)">
    <a class="lx-btn lx-btn--primary lx-btn--block" href="C-Lista.dc.html">Importar 4 elementos</a>
  </footer>
</div>
</template>
<script type="text/x-dc" data-props='{"tema": {"editor": "enum", "options": ["claro", "oscuro"], "default": "claro", "section": "Tema"}, "letra": {"editor": "enum", "options": ["Kai", "Sans", "Song"], "default": "Kai", "section": "Tema"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const letra = this.props.letra ?? 'Kai';
    return {
      tema: this.props.tema ?? 'claro',
      fontClass: letra === 'Sans' ? 'lx-font-hei' : letra === 'Song' ? 'lx-font-song' : ''
    };
  }
}
</script>
</body>
</html>
