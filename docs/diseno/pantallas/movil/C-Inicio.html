    <section class="lx-card" style="flex-direction: row; align-items: center; gap: var(--space-3)">
      <div style="flex: 1; display: flex; flex-direction: column; gap: var(--space-1)">

        <div style="display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap">
          <ruby class="lx-hz" lang="zh-Hans" style="font-size: 22px; line-height: 1.9"><span class="t4">在</span><rt class="t4" style="font-size: 11px">zài</rt><span class="t1">商</span><rt class="t1" style="font-size: 11px">shāng</rt><span class="t4">店</span><rt class="t4" style="font-size: 11px">diàn</rt></ruby>

    <a href="C-Progreso.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
