<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecturas: lista (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
    <a href="C-Inicio.dc.html" aria-label="Volver a Practicar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 700">Lecturas</h1><a href="C-TextoNuevo.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Mi texto</a>
  </header>
  <main style="flex: 1; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 18px; overflow: auto">
      <a href="C-Lectura.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; border-radius: 10px; background: var(--jade); color: var(--on-jade); text-decoration: none">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--on-jade)">RECOMENDADA PARA TI</span>
        <span style="font-size: 18px; font-weight: 600">En la tienda</span>
        <span style="font-size: 14px; color: var(--on-jade)">Conoces el [95] % de sus palabras · unos [2] min</span>
      </a>
      <div role="group" aria-label="Filtrar lecturas" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
          <button aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 20px; font: inherit; font-size: 14px; {{ f.style }}; background: var(--surface)">{{ f.label }}</button>
        </sc-for>
      </div>
      <section aria-labelledby="r-hsk1" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 id="r-hsk1" style="margin: 0; font-size: 16px; font-weight: 700">HSK 1 · ordenadas por palabras conocidas</h2>
        </div>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <li><a href="C-Lectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 20px; line-height: 1.8"><span style="color: {{ hc4 }}">在</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">zài</rt><span style="color: {{ hc1 }}">商</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc1 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">shāng</rt><span style="color: {{ hc4 }}">店</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">diàn</rt></ruby><span style="font-size: 14px; font-weight: 700">95 %</span></span>
            <span style="font-size: 15px; font-weight: 600">En la tienda</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 95%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">95 % de palabras conocidas · [5] frases · [1] palabra nueva · Sin leer</span>
          </a></li>
          <li><a href="C-Lectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 20px; line-height: 1.8"><span style="color: {{ hc3 }}">我</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc3 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">wǒ</rt><span style="color: {{ hc5 }}">的</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">de</rt><span style="color: {{ hc2 }}">朋</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc2 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">péng</rt><span style="color: {{ hc5 }}">友</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">you</rt></ruby><span style="font-size: 14px; font-weight: 700">92 %</span></span>
            <span style="font-size: 15px; font-weight: 600">Mi amigo</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 92%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">92 % de palabras conocidas · [6] frases · [2] palabras nuevas · Sin leer</span>
          </a></li>
          <li><a href="C-Lectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 20px; line-height: 1.8"><span style="color: {{ hc3 }}">我</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc3 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">wǒ</rt><span style="color: {{ hc5 }}">的</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc5 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">de</rt><span style="color: {{ hc1 }}">家</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc1 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">jiā</rt></ruby><span style="font-size: 14px; font-weight: 700">100 %</span></span>
            <span style="font-size: 15px; font-weight: 600">Mi familia</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">100 % de palabras conocidas · [4] frases · Leída · [3] de [3]</span>
          </a></li>
          <li><a href="C-Lectura.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface)">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><ruby lang="zh-Hans" style="ruby-position: under; font-family: var(--font-kai); font-size: 20px; line-height: 1.8"><span style="color: {{ hc4 }}">在</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">zài</rt><span style="color: {{ hc2 }}">学</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc2 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">xué</rt><span style="color: {{ hc4 }}">校</span><rt style="font-family: var(--font-sans); font-size: 10px; color: {{ pc4 }}; opacity: {{ pinyinOpacity }}; visibility: {{ rtVis }}">xiào</rt></ruby><span style="font-size: 14px; font-weight: 700">61 %</span></span>
            <span style="font-size: 15px; font-weight: 600">En el colegio</span>
            <span aria-hidden="true" style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><span style="display: block; width: 61%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></span></span>
            <span style="font-size: 13px; color: var(--ink-2)">61 % de palabras conocidas · [8] frases · [9] palabras nuevas · Sin leer · muchas palabras nuevas</span>
          </a></li>
        </ul>
        <span style="font-size: 12px; color: var(--ink-2)">Todas están disponibles. Recomendamos las que tienen al menos un [90] % de palabras que ya conoces.</span>
      </section>
  </main>
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <button aria-label="Cerrar ajustes de estudio" onClick="{{ closeSheet }}" style="position: absolute; inset: 0; border: 0; background: var(--scrim)"></button>
    <section role="dialog" aria-label="Ajustes de estudio" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 20px 20px 32px; background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Ajustes de estudio</h2>
        <button onClick="{{ closeSheet }}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink)">Listo</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="m-size-label" style="font-size: 14px; font-weight: 600">1 · Tamaño de los caracteres</span>
        <div role="group" aria-labelledby="m-size-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="3">
            <button aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; {{ s.style }}; background: var(--surface)">{{ s.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="m-pinyin-label" style="font-size: 14px; font-weight: 600">2 · Pinyin</span>
        <div role="group" aria-labelledby="m-pinyin-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
            <button aria-pressed="{{ m.pressed }}" onClick="{{ m.pick }}" style="min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; {{ m.style }}; background: var(--surface)">{{ m.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ showSlider }}" hint-placeholder-val="{{ true }}">
          <label for="m-opacity" style="display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2)">Opacidad <span>{{ opacity }} %</span></label>
          <input id="m-opacity" type="range" min="10" max="90" step="10" value="{{ opacity }}" onChange="{{ setOpacity }}" style="width: 100%; height: 36px">
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="m-color-label" style="font-size: 14px; font-weight: 600">3 · Colores según el tono</span>
        <div role="group" aria-labelledby="m-color-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{ colorModes }}" as="c" hint-placeholder-count="3">
            <button aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ c.style }}; background: var(--surface)">{{ c.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ colorsOn }}" hint-placeholder-val="{{ true }}">
          <div aria-label="Leyenda de colores por tono" style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2)">
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-1)"></span>1.º ā</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-2)"></span>2.º á</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-3)"></span>3.º ǎ</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-4)"></span>4.º à</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--jade-bright)"></span>neutro</span>
          </div>
        </sc-if>
      </div>
      <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600">4 · Audio automático al girar <input type="checkbox" checked="{{ autoAudio }}" onChange="{{ toggleAudio }}" style="width: 22px; height: 22px"></label>

      <span style="font-size: 12px; color: var(--ink-2)">Se guarda para todas tus sesiones. Más opciones en Perfil › Ajustes.</span>
    </section>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: false, mode: 'atenuado', opacity: 40, size: 'M', color: 'pinyin', autoAudio: false, filter: 'todas' };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;
    const on = 'background: var(--jade-tint); color: var(--ink); border-color: var(--jade); font-weight: 600';
    const off = 'background: var(--surface); color: var(--ink)';
    const group = (key, list) => list.map(([id, label]) => ({
      label, pressed: String(s[key] === id), style: s[key] === id ? on : off, pick: () => this.setState({ [key]: id })
    }));
    const TONE = { 1: 'var(--tone-1)', 2: 'var(--tone-2)', 3: 'var(--tone-3)', 4: 'var(--tone-4)', 5: 'var(--tone-5)' };
    const pc = (t) => (s.color === 'no' ? 'var(--ink-2)' : TONE[t]);
    const hc = (t) => (s.color === 'ambos' ? TONE[t] : 'var(--ink)');
    return { tema: __tema, 
      sheetOpen: s.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      sizes: group('size', [['S', 'Pequeño'], ['M', 'Normal'], ['L', 'Grande']]),
      modes: group('mode', [['mostrar', 'Mostrar'], ['atenuado', 'Atenuado'], ['ocultar', 'Ocultar']]),
      colorModes: group('color', [['no', 'Sin color'], ['pinyin', 'Pinyin'], ['ambos', 'Pinyin y caracteres']]),
      opacity: s.opacity,
      setOpacity: (e) => this.setState({ opacity: Number(e.target.value) }),
      showSlider: s.mode === 'atenuado',
      pinyinHidden: s.mode === 'ocultar',
      rtVis: s.mode === 'ocultar' ? 'hidden' : 'visible',
      pinyinOpacity: s.mode === 'mostrar' ? 1 : s.opacity / 100,
      charSize: s.size === 'S' ? 60 : s.size === 'L' ? 104 : 80,
      colorsOn: s.color !== 'no',
      pc1: pc(1), pc2: pc(2), pc3: pc(3), pc4: pc(4), pc5: pc(5),
      hc1: hc(1), hc2: hc(2), hc3: hc(3), hc4: hc(4), hc5: hc(5),
      autoAudio: s.autoAudio,
      toggleAudio: () => this.setState({ autoAudio: !s.autoAudio }),
      filters: [['todas', 'Todas'], ['sin', 'Sin leer'], ['leidas', 'Leídas']].map(([id, label]) => ({
        label, pressed: String((s.filter || 'todas') === id),
        style: (s.filter || 'todas') === id ? 'background: var(--jade); color: var(--surface); border-color: var(--jade)' : 'background: var(--surface); color: var(--ink)',
        pick: () => this.setState({ filter: id })
      }))
    };
  }
}
</script>
</body>
</html>
