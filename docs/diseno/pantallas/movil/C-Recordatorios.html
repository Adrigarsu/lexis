<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordatorios (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="C-Perfil.dc.html" aria-label="Volver a Perfil" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">Recordatorios</h1>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <section style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-sunken)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true" style="stroke: var(--ink-2)"><path d="M20 6 9 17l-5-5"/></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 500">Notificaciones permitidas en este dispositivo</span>
        <span style="font-size: 12px; color: var(--ink-2)">En iPhone solo llegan con la app instalada en la pantalla de inicio.</span>
      </div>
    </section>

    <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface)">
        <label style="display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{ k.name }}</span><span style="font-size: 12px; color: var(--ink-2)">{{ k.desc }}</span></span>
          <input type="checkbox" role="switch" checked="{{ k.on }}" style="width: 44px; height: 24px; accent-color: var(--ink)">
        </label>
        <div style="display: flex; align-items: center; gap: 8px">
          <sc-if value="{{ k.weekly }}" hint-placeholder-val="{{ false }}">
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2)">Día<select style="min-height: 40px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font: inherit; font-size: 14px"><option>Domingo</option><option>Lunes</option></select></label>
          </sc-if>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2)">Hora<input type="time" value="{{ k.time }}" style="min-height: 40px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; background: var(--surface)"></label>
        </div>
      </section>
    </sc-for>

    <span style="font-size: 12px; color: var(--ink-2); line-height: 1.5">Como máximo 2 avisos al día. No te avisamos si ya has estudiado ni en tus días de descanso. Hora de [Madrid], según tu dispositivo.</span>
  </main>

  <nav aria-label="Navegación principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); padding: 8px 8px 24px">
    <a href="C-Inicio.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 11px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Hoy</a>
    <a href="C-Inicio.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 11px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>Practicar</a>
    <a href="C-Progreso.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 11px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>
    <a href="C-Perfil.dc.html" aria-current="page" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</a>
  </nav>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    return { tema: __tema, 
      kinds: [
        { name: 'Recordatorio diario', desc: 'Si aún no has estudiado hoy', time: '20:00', on: true, weekly: false },
        { name: 'Racha en riesgo', desc: 'Por la noche, si vas a perder la racha', time: '22:00', on: true, weekly: false },
        { name: 'Resumen semanal', desc: 'Palabras aprendidas, tiempo y racha', time: '19:00', on: true, weekly: true },
        { name: 'Repasos acumulados', desc: 'Tras 3 o más días sin entrar; cada vez más espaciados', time: '12:00', on: false, weekly: false }
      ]
    };
  }
}
</script>
</body>
</html>
