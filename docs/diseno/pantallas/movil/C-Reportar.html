<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportar un error (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px">
    <a href="C-Inicio.dc.html" aria-label="Salir de la sesión" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: var(--ink-2)">[7] de [23] · unos [11] min restantes</span>
      <div style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><div style="width: 30%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></div></div>
    </div>
    <button aria-label="Ajustes de estudio" aria-haspopup="dialog" style="width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>
  <main style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
    <span lang="zh-Hans" style="font-family: var(--font-kai); font-size: 72px">打</span>
    <span style="font-size: 18px; font-weight: 600">dǎ</span>
    <span style="font-size: 15px">pegar, golpear</span>
    <button onClick="{{ openSheet }}" style="margin-top: 12px; min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--ink-2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 21V4h12l-2 4 2 4H4"/></svg>Reportar un error</button>
  </main>
  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: flex-end">
      <form role="dialog" aria-modal="true" aria-labelledby="rep" style="width: 100%; box-sizing: border-box; padding: 20px 20px 28px; border-radius: 16px 16px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 8px">
          <h2 id="rep" style="flex: 1; margin: 0; font-size: 18px; font-weight: 700">Reportar un error</h2>
          <button type="button" aria-label="Cerrar" onClick="{{ close }}" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <span style="font-size: 13px; color: var(--ink-2)">Sobre la tarjeta <span lang="zh-Hans" style="font-family: var(--font-kai)">打</span> (significado)</span>
        <fieldset style="margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface)">
          <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Qué falla</legend>
          <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 14px"><input type="radio" name="motivo" checked>Significado</label>
          <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 14px"><input type="radio" name="motivo">Pinyin o tono</label>
          <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 14px"><input type="radio" name="motivo">Audio</label>
          <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 14px"><input type="radio" name="motivo">Frase de ejemplo</label>
          <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 14px"><input type="radio" name="motivo">Trazos del carácter</label>
          <label style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 0; font-size: 14px"><input type="radio" name="motivo">Otra cosa</label>
        </fieldset>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Cuéntanos qué falla<textarea rows="3" style="box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; font: inherit; font-weight: 400; resize: vertical; background: var(--surface)"></textarea></label>
        <button type="button" onClick="{{ send }}" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: var(--jade); color: var(--on-jade); text-decoration: none; font: inherit; font-size: 16px; font-weight: 600">Enviar</button>
      </form>
    </div>
  </sc-if>
  <sc-if value="{{ thanks }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 32px; padding: 14px 16px; border-radius: 10px; background: var(--warning-tint); color: var(--ink); display: flex; align-items: center; gap: 10px; font-size: 14px">
      <span style="flex: 1">Gracias. Lo revisaremos y te avisaremos si lo corregimos.</span>
      <button onClick="{{ close }}" style="min-height: 40px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--on-jade)">Cerrar</button>
    </div>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, sent: false };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    return { tema: __tema, 
      sheet: this.state.open && !this.state.sent,
      thanks: this.state.sent,
      openSheet: () => this.setState({ open: true, sent: false }),
      close: () => this.setState({ open: false, sent: false }),
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
