<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen de la sesión (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5C50}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--paper); color: var(--ink); display: flex; flex-direction: column">
  <main style="flex: 1; padding: var(--space-16) var(--space-5) var(--space-2); display: flex; flex-direction: column; gap: var(--space-6)">
    <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center">
      <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: var(--radius-pill); background: var(--jade-tint); color: var(--jade); display: grid; place-items: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <h1 style="margin: 0; font: 700 28px/34px var(--font-sans)">Sesión completada</h1>
      <span style="display: inline-flex; align-items: center; gap: var(--space-2); font: 500 15px/20px var(--font-sans); color: var(--ink-2)"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: var(--radius-sm); background: var(--seal); color: var(--paper); display: grid; place-items: center; font: 400 15px/1 var(--font-kai)">日</span>Racha: <b style="color: var(--ink)">[13] días</b></span>
    </div>

    <section aria-label="Datos de la sesión" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3)">
      <div class="lx-card" style="gap: 2px"><span class="lx-card__eyebrow">Tiempo</span><span style="font: 700 24px/30px var(--font-sans)">[16] min</span></div>
      <div class="lx-card" style="gap: 2px"><span class="lx-card__eyebrow">Repasos</span><span style="font: 700 24px/30px var(--font-sans)">[23]</span></div>
      <div class="lx-card" style="gap: 2px"><span class="lx-card__eyebrow">Palabras nuevas</span><span style="font: 700 24px/30px var(--font-sans)">[5]</span></div>
      <div class="lx-card" style="gap: 2px"><span class="lx-card__eyebrow">Acierto</span><span style="font: 700 24px/30px var(--font-sans)">[87] %</span></div>
    </section>

    <section class="lx-card" style="gap: var(--space-3)">
      <div style="display: flex; align-items: center; gap: var(--space-2)"><span class="lx-chip lx-chip--success">Nuevo</span><h2 class="lx-card__title" style="font-size: 16px">Desbloqueado hoy</h2></div>
      <span class="lx-card__meta">Ya conoces bien su significado: empiezas a escribirlas y pronunciarlas.</span>
      <div style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
        <span class="lx-card" style="flex-direction: row; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3)"><ruby class="lx-hz" lang="zh-Hans" style="font-size: 22px; line-height: 1.7"><span class="t4">爸</span><rt class="t4" style="font-size: 11px">bà</rt><span class="t5">爸</span><rt class="t5" style="font-size: 11px">ba</rt></ruby><span class="lx-card__meta" style="font-size: 13px">papá</span></span>
        <span class="lx-card" style="flex-direction: row; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3)"><ruby class="lx-hz" lang="zh-Hans" style="font-size: 22px; line-height: 1.7"><span class="t1">妈</span><rt class="t1" style="font-size: 11px">mā</rt><span class="t5">妈</span><rt class="t5" style="font-size: 11px">ma</rt></ruby><span class="lx-card__meta" style="font-size: 13px">mamá</span></span>
        <span class="lx-card" style="flex-direction: row; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3)"><ruby class="lx-hz" lang="zh-Hans" style="font-size: 22px; line-height: 1.7"><span class="t4">谢</span><rt class="t4" style="font-size: 11px">xiè</rt><span class="t5">谢</span><rt class="t5" style="font-size: 11px">xie</rt></ruby><span class="lx-card__meta" style="font-size: 13px">gracias</span></span>
      </div>
    </section>
  </main>
  <footer style="padding: var(--space-3) var(--space-5) var(--space-8); display: flex; flex-direction: column; gap: var(--space-3)">
    <a class="lx-btn lx-btn--primary lx-btn--block" href="C-Inicio.dc.html">Volver al inicio</a>
    <a class="lx-btn lx-btn--secondary lx-btn--block" href="C-Practicar.dc.html">Seguir practicando</a>
  </footer>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { tema: this.props.tema ?? 'claro' };
  }
}
</script>
</body>
</html>
