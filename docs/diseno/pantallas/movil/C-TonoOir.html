<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonos: identificar el tono (móvil) · Lexis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--jade)}a:hover{color:var(--ink)}
[role="status"] a{color:var(--ink)}
</style>
<link rel="stylesheet" href="../assets/lexis.css">
<script src="../assets/dc-runtime.js"></script>
</head>
<body style="margin:0">
<div id="dc-root"></div>
<template id="dc-template">
<div class="lx" data-theme="{{ tema }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--paper); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px">
    <a href="C-Tonos.dc.html" aria-label="Salir de la práctica" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: var(--ink-2)">Tonos · [3] de [10]</span>
      <div style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><div style="width: 30%; height: 6px; border-radius: 3px; background: var(--jade-bright)"></div></div>
    </div>
    <button aria-label="Ajustes de estudio" aria-haspopup="dialog" onClick="{{ openSheet }}" style="width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>
  <main style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2)">¿QUÉ TONO OYES?</span>
      <span style="font-size: 13px; color: var(--ink-2)">El color y la marca del tono se ocultan hasta que respondas.</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <button aria-label="Escuchar" style="width: 96px; height: 96px; border: 2px solid var(--ink); border-radius: 48px; background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <span style="font-size: 32px; font-weight: 600; letter-spacing: 0.02em">ma</span>
      <button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; min-height: 40px; font-size: 13px">Más lento</button>
    </div>
    <div role="group" aria-label="Tonos" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ tones }}" as="t" hint-placeholder-count="4">
          <button aria-pressed="{{ t.pressed }}" onClick="{{ t.choose }}" style="min-height: 92px; padding: 10px; border-radius: 10px; background: var(--surface); font: inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; {{ t.style }}">
            <svg aria-hidden="true" width="40" height="28" viewBox="0 0 24 24" fill="none" stroke="{{ t.c }}" stroke-width="2.4" stroke-linecap="round"><path d="{{ t.d }}"/></svg>
            <span style="font-size: 16px; font-weight: 600">{{ t.n }} <span style="color: {{ t.c }}">{{ t.mark }}</span></span>
            <span style="font-size: 12px; font-weight: 600">{{ t.result }}</span>
          </button>
        </sc-for>
    </div>
    <sc-if value="{{ right }}" hint-placeholder-val="{{ false }}">
      <section role="status" style="padding: 14px; border: 2px solid var(--success); border-radius: 10px; display: flex; flex-direction: column; gap: 4px; background: var(--success-tint)">
        <span style="font-size: 16px; font-weight: 700">Correcto</span>
        <span style="font-size: 14px; color: var(--ink-2)">Tercer tono: baja y vuelve a subir. <span lang="zh-Hans" style="font-family: var(--font-kai)">马</span> mǎ, caballo.</span>
      </section>
    </sc-if>
    <sc-if value="{{ wrong }}" hint-placeholder-val="{{ false }}">
      <section role="status" style="padding: 14px; border: 2px solid var(--ink); border-radius: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface)">
        <span style="font-size: 16px; font-weight: 700">Era el 3.º tono: mǎ</span>
        <span style="font-size: 14px; color: var(--ink-2)">Elegiste el {{ picked }}. El 3.º baja hasta el fondo antes de subir; el 2.º sube desde el principio.</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap"><button style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Oír los dos</button><button onClick="{{ reset }}" style="min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Probar otra vez</button></div>
      </section>
    </sc-if>
  </main>
  <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
    <footer style="padding: 8px 20px 28px"><a href="C-TonoPar.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--jade); color: var(--on-jade); text-decoration: none; font-size: 16px; font-weight: 600">Continuar</a></footer>
  </sc-if>
  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <button aria-label="Cerrar ajustes de estudio" onClick="{{ closeSheet }}" style="position: absolute; inset: 0; border: 0; background: var(--scrim)"></button>
    <section role="dialog" aria-label="Ajustes de estudio" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 20px 20px 32px; background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Ajustes de estudio</h2>
        <button onClick="{{ closeSheet }}" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink)">Listo</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="m-size-label" style="font-size: 14px; font-weight: 600">1 · Tamaño de los caracteres</span>
        <div role="group" aria-labelledby="m-size-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="3">
            <button aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; {{ s.style }}; background: var(--surface)">{{ s.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="m-pinyin-label" style="font-size: 14px; font-weight: 600">2 · Pinyin</span>
        <div role="group" aria-labelledby="m-pinyin-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
            <button aria-pressed="{{ m.pressed }}" onClick="{{ m.pick }}" style="min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 14px; {{ m.style }}; background: var(--surface)">{{ m.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ showSlider }}" hint-placeholder-val="{{ true }}">
          <label for="m-opacity" style="display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2)">Opacidad <span>{{ opacity }} %</span></label>
          <input id="m-opacity" type="range" min="10" max="90" step="10" value="{{ opacity }}" onChange="{{ setOpacity }}" style="width: 100%; height: 36px">
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="m-color-label" style="font-size: 14px; font-weight: 600">3 · Colores según el tono</span>
        <div role="group" aria-labelledby="m-color-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{ colorModes }}" as="c" hint-placeholder-count="3">
            <button aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-size: 13px; {{ c.style }}; background: var(--surface)">{{ c.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ colorsOn }}" hint-placeholder-val="{{ true }}">
          <div aria-label="Leyenda de colores por tono" style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2)">
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-1)"></span>1.º ā</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-2)"></span>2.º á</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-3)"></span>3.º ǎ</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--tone-4)"></span>4.º à</span>
            <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: var(--jade-bright)"></span>neutro</span>
          </div>
        </sc-if>
      </div>
      <label style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600">4 · Audio automático al girar <input type="checkbox" checked="{{ autoAudio }}" onChange="{{ toggleAudio }}" style="width: 22px; height: 22px"></label>

      <span style="font-size: 12px; color: var(--ink-2)">Se guarda para todas tus sesiones. Más opciones en Perfil › Ajustes.</span>
    </section>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: false, mode: 'atenuado', opacity: 40, size: 'M', color: 'pinyin', autoAudio: false, pick: null };
  }
  renderVals() {
    const __tema = this.props.tema ?? 'claro';
    const s = this.state;
    const ANSWER = 3;
    const MARK = { 1: 'mā', 2: 'má', 3: 'mǎ', 4: 'mà' };
    const on = 'background: var(--jade-tint); color: var(--ink); border-color: var(--jade); font-weight: 600';
    const off = 'background: var(--surface); color: var(--ink)';
    const group = (key, list) => list.map(([id, label]) => ({
      label, pressed: String(s[key] === id), style: s[key] === id ? on : off, pick: () => this.setState({ [key]: id })
    }));
    const TONE = { 1: 'var(--tone-1)', 2: 'var(--tone-2)', 3: 'var(--tone-3)', 4: 'var(--tone-4)', 5: 'var(--tone-5)' };
    const pc = (t) => (s.color === 'no' ? 'var(--ink-2)' : TONE[t]);
    const hc = (t) => (s.color === 'ambos' ? TONE[t] : 'var(--ink)');
    return { tema: __tema, 
      sheetOpen: s.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      sizes: group('size', [['S', 'Pequeño'], ['M', 'Normal'], ['L', 'Grande']]),
      modes: group('mode', [['mostrar', 'Mostrar'], ['atenuado', 'Atenuado'], ['ocultar', 'Ocultar']]),
      colorModes: group('color', [['no', 'Sin color'], ['pinyin', 'Pinyin'], ['ambos', 'Pinyin y caracteres']]),
      opacity: s.opacity,
      setOpacity: (e) => this.setState({ opacity: Number(e.target.value) }),
      showSlider: s.mode === 'atenuado',
      pinyinHidden: s.mode === 'ocultar',
      rtVis: s.mode === 'ocultar' ? 'hidden' : 'visible',
      pinyinOpacity: s.mode === 'mostrar' ? 1 : s.opacity / 100,
      charSize: s.size === 'S' ? 60 : s.size === 'L' ? 104 : 80,
      colorsOn: s.color !== 'no',
      pc1: pc(1), pc2: pc(2), pc3: pc(3), pc4: pc(4), pc5: pc(5),
      hc1: hc(1), hc2: hc(2), hc3: hc(3), hc4: hc(4), hc5: hc(5),
      autoAudio: s.autoAudio,
      toggleAudio: () => this.setState({ autoAudio: !s.autoAudio }),
      tones: [1, 2, 3, 4].map((t) => ({
        n: t + '.º', mark: MARK[t], d: { 1: 'M3 7H21', 2: 'M3 17L21 6', 3: 'M3 9C8 21 13 20 21 6', 4: 'M3 6L21 18' }[t],
        c: pc(t), key: String(t),
        pressed: String(s.pick === t),
        result: s.pick === null ? '' : t === ANSWER ? 'Correcto' : t === s.pick ? 'Tu respuesta' : '',
        style: s.pick === null ? 'border: 1px solid var(--line-strong)' : t === ANSWER ? 'border: 3px solid var(--jade); background: var(--surface-sunken)' : t === s.pick ? 'border: 2px dashed var(--jade-bright)' : 'border: 1px solid var(--surface-sunken); opacity: 0.6',
        choose: () => (s.pick === null ? this.setState({ pick: t }) : null)
      })),
      waiting: s.pick === null,
      answered: s.pick !== null,
      right: s.pick === ANSWER,
      wrong: s.pick !== null && s.pick !== ANSWER,
      picked: s.pick === null ? '' : s.pick + '.º (' + MARK[s.pick] + ')',
      reset: () => this.setState({ pick: null })
    };
  }
}
</script>
</body>
</html>
