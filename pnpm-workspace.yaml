packages:
  - apps/*
  - packages/*

# lefthook is installed by the root "prepare" script, not by its own postinstall (D-155).
# The Supabase CLI postinstall downloads its binary for this platform (D-156).
allowBuilds:
  lefthook: false
  supabase: true

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y 6.10.2 works with ESLint 10 but its peer range stops at ^9 (D-152).
    eslint-plugin-jsx-a11y>eslint: '10'
